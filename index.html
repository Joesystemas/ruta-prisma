VISTAS.pregunta=()=>{
  const M=MARCOS[S.marco];
  return encabezado("pregunta","Pregunta de investigación","Estructura tu pregunta con un marco. Cada elemento se convertirá luego en un bloque de búsqueda.")+guia("pregunta")+
  `<section class="card"><h2>1. Elige el marco</h2><div class="seg" role="group" aria-label="Marco">${Object.entries(MARCOS).map(([k,m])=>`<button data-act="marco" data-v="${k}" aria-pressed="${S.marco===k}">${m.nombre}</button>`).join("")}</div><p class="muted small">${M.uso}</p></section>
  <section class="card"><h2>2. Describe cada elemento</h2><div class="grid2">${M.campos.map(f=>`<label class="f"><span><span class="mono" style="color:var(--accent)">${f.k}</span> · ${f.n}</span><small>${f.h} <i>Ej.:</i> ${esc(f.ej)}</small>${ta("campos."+f.k,f.ej,2)}</label>`).join("")}</div></section>
  <section class="card"><h2>3. Pregunta resultante</h2><p class="small muted">Generada automáticamente. Puedes editarla para mejorar la redacción.</p>
    <pre class="q" id="qGen" style="font-family:var(--f-body);font-size:1rem">${esc(M.plantilla(S.campos))}</pre>
    <div class="row"><button class="btn" data-act="usarPregunta">Usar esta redacción</button><button class="btn" data-act="tutorPregunta">Pedir retroalimentación al tutor</button></div>
    <label class="f">Pregunta final${ta("pregunta","¿…?",2)}</label>
    <label class="f">Justificación <small>Ítem 3: por qué es necesaria esta revisión y qué vacío cubre.</small>${ta("justificacion","Existen estudios dispersos sobre… pero no hay una síntesis reciente que…",4)}</label>
    <label class="f">Objetivos <small>Ítem 4: uno general y, si hace falta, específicos.</small>${ta("objetivos","Sintetizar la evidencia sobre…",3)}</label>
    <div id="rubPregunta"></div></section>`+pie("pregunta");
};
POST.pregunta=()=>rubricaPregunta();
function rubricaPregunta(){
  const el=$("#rubPregunta");if(!el)return;const M=MARCOS[S.marco];
  const chk=[[M.campos.filter(f=>f.k!=="C").every(f=>(S.campos[f.k]||"").trim().length>3),"Todos los elementos del marco están descritos"],
    [/\?\s*$/.test(S.pregunta.trim()),"La pregunta final es interrogativa"],[S.pregunta.trim().split(/\s+/).length<=45&&S.pregunta.trim().length>0,"La pregunta es concisa (≤ 45 palabras)"],
    [S.justificacion.trim().length>80,"La justificación tiene al menos dos oraciones"],[S.objetivos.trim().length>20,"Hay objetivos explícitos"]];
  el.innerHTML=`<div class="eyebrow">Autoevaluación</div><ul class="checks" style="list-style:none;padding:0;margin:0">${chk.map(([ok,t])=>`<li><span class="chip ${ok?"ok":""}">${ok?"Cumple":"Falta"}</span> ${t}</li>`).join("")}</ul>`;
}

/* ---------- Protocolo ---------- */
const METODOS=[["m8","8","Proceso de selección"],["m9","9","Proceso de extracción de datos"],["m10a","10a","Desenlaces buscados"],["m10b","10b","Otras variables"],["m11","11","Evaluación del riesgo de sesgo / calidad"],["m12","12","Medidas del efecto"],["m13a","13a","Elegibilidad para cada síntesis"],["m13b","13b","Preparación de datos"],["m13c","13c","Tabulación y presentación"],["m13d","13d","Método de síntesis"],["m13e","13e","Heterogeneidad"],["m13f","13f","Análisis de sensibilidad"],["m14","14","Sesgo de publicación"],["m15","15","Certeza de la evidencia"]];
function modeloEN(k){
  const P=S.protocolo,c=S.campos,h=HERRAMIENTAS.find(x=>x.id===P.herramienta);
  const two=P.revisores==="1"?"One reviewer":(P.revisores==="3"?"Three":"Two")+" reviewers";const ind=P.independiente==="Sí"?" independently":"";
  const meta=P.sintesisTipo.startsWith("Metaanálisis");
  return {
   m8:`${two}${ind} screened the titles and abstracts of all records and then the full texts of the retrieved reports, applying the predefined eligibility criteria. Disagreements were resolved by consensus${P.revisores!=="1"?" and, if they persisted, by a third reviewer":""}. The criteria were piloted on 25 records. Screening was managed in Ruta PRISMA and an Excel workbook; ${P.revisores!=="1"?"inter-reviewer agreement was calculated with Cohen's kappa":"no automation tools were used to exclude records"}.`,
   m9:`${two}${ind} extracted data using a standardised form piloted on three studies. Extracted items: authorship, year, country, design, sample, characteristics of ${c.I||c.E||c.PI||c.C1||"the intervention or phenomenon"}, outcomes and main findings. Study authors were not contacted for additional data.`,
   m10a:`Outcomes: ${c.O||c.E||"[define the outcomes]"}. All results compatible with each outcome domain were collected, regardless of instrument or time point.`,
   m10b:"Other variables: country, level or setting, sample size and characteristics, design, duration of the intervention or exposure and funding source. Missing information was recorded as “not reported”.",
   m11:`Methodological quality was appraised with ${tr(h?.n||"[tool]")}; ${two.toLowerCase()} assessed each study${ind} and resolved discrepancies by consensus.`,
   m12:meta?"The standardised mean difference (Hedges' g) with its 95% confidence interval was used.":"No effect measures were calculated; the direction of effect reported by each study was described.",
   m13a:"Studies were grouped for synthesis by outcome and type of intervention or phenomenon, comparing their characteristics with the groups planned in the protocol.",
   m13b:"No data transformation was needed; results were recorded as reported.",
   m13c:"The characteristics and results of each study are presented in structured tables ordered by theme and year.",
   m13d:meta?"A random-effects meta-analysis (REML) was conducted in R (metafor package); heterogeneity was assessed with I² and τ².":`A ${tr(P.sintesisTipo).toLowerCase().replace("swim","SWiM")} synthesis was conducted following the SWiM guideline, grouping findings by theme and describing the direction and consistency of results.`,
   m13e:"Heterogeneity was explored descriptively by country, educational level and study design.",
   m13f:"No formal sensitivity analyses were conducted; we examined whether conclusions changed when the lowest-quality studies were omitted.",
   m14:"Risk of bias due to missing results was assessed qualitatively, considering the search of grey literature sources and multiple languages.",
   m15:`Certainty of evidence for each outcome was assessed with ${P.certeza}.`
  }[k];
}
function modelo(k){
  if(LANG==="en")return modeloEN(k);
  const P=S.protocolo,c=S.campos,h=HERRAMIENTAS.find(x=>x.id===P.herramienta);
  const dos=P.revisores==="1"?"Un revisor":"Dos revisores";
  const indep=P.independiente==="Sí"?" de forma independiente":"";
  return {
   m8:`${dos} cribaron${indep} los títulos y resúmenes de todos los registros y, después, los textos completos de los informes recuperados, aplicando los criterios de elegibilidad predefinidos. Los desacuerdos se resolvieron por consenso${P.revisores!=="1"?" y, de persistir, con un tercer revisor":""}. Se realizó una prueba piloto con 25 registros. El cribado se gestionó en la herramienta Ruta PRISMA y en una hoja de cálculo de Excel; ${P.revisores!=="1"?"el acuerdo entre revisores se calculó con el coeficiente kappa de Cohen":"no se utilizaron herramientas de automatización para excluir registros"}.`,
   m9:`${dos} extrajeron${indep} los datos con un formulario estandarizado y piloteado en tres estudios. Se extrajeron: autoría, año, país, diseño, muestra, ${c.I||c.E||c.PI||c.C1?"características de "+(c.I||c.E||c.PI||c.C1):"intervención o fenómeno"}, resultados y hallazgos principales. No se contactó a los autores para obtener datos adicionales.`,
   m10a:`Desenlaces: ${c.O||c.E||"[defina los desenlaces]"}. Se recogieron todos los resultados compatibles con cada dominio, con independencia del instrumento o del momento de medición.`,
   m10b:`Otras variables: país, nivel o contexto, tamaño y características de la muestra, diseño, duración de la intervención o exposición y fuente de financiación. La información ausente se registró como «no reportado».`,
   m11:`La calidad metodológica se valoró con ${h?.n||"[herramienta]"}; ${dos.toLowerCase()} evaluaron${indep} cada estudio y resolvieron discrepancias por consenso.`,
   m12:P.sintesisTipo.startsWith("Metaanálisis")?"Se usó la diferencia de medias estandarizada (g de Hedges) con su intervalo de confianza del 95 %.":"No se calcularon medidas del efecto; se describió la dirección del efecto reportada por cada estudio.",
   m13a:"Los estudios se agruparon para la síntesis según el desenlace y el tipo de intervención o fenómeno, comparando sus características con los grupos previstos en el protocolo.",
   m13b:"No fue necesario transformar datos; los resultados se registraron tal como se reportaron.",
   m13c:"Las características y los resultados de cada estudio se presentan en tablas estructuradas ordenadas por tema y año.",
   m13d:P.sintesisTipo.startsWith("Metaanálisis")?"Se realizó un metaanálisis de efectos aleatorios (REML) en R (paquete metafor); la heterogeneidad se evaluó con I² y τ².":`Se realizó una síntesis ${P.sintesisTipo.toLowerCase().replace("swim","SWiM").replace(" (scoping)","")} siguiendo la guía SWiM, agrupando los hallazgos por temas y describiendo la dirección y consistencia de los resultados.`,
   m13e:"La heterogeneidad se exploró de forma descriptiva según país, nivel educativo y diseño de estudio.",
   m13f:"No se realizaron análisis de sensibilidad formales; se examinó si las conclusiones cambiaban al omitir los estudios de menor calidad.",
   m14:"El riesgo de sesgo por resultados faltantes se valoró cualitativamente, considerando la búsqueda en fuentes de literatura gris y en varios idiomas.",
   m15:`La certeza de la evidencia por desenlace se valoró con ${P.certeza}.`
  }[k];
}
VISTAS.protocolo=()=>{
  const P=S.protocolo;
  const crit=(tipo,lbl)=>`<div style="display:grid;gap:8px"><h3>${lbl}</h3>${P[tipo].length?`<div class="tbl"><table><thead><tr><th>Dimensión</th><th>Criterio</th><th>Justificación</th><th></th></tr></thead><tbody>${P[tipo].map((c,i)=>`<tr><td>${esc(c.dim)}</td><td><input type="text" data-bind="protocolo.${tipo}.${i}.texto" value="${esc(c.texto)}"></td><td><input type="text" data-bind="protocolo.${tipo}.${i}.just" value="${esc(c.just||"")}" placeholder="¿Por qué?"></td><td><button class="btn sm ghost" data-act="delCrit" data-t="${tipo}" data-i="${i}" aria-label="Quitar">✕</button></td></tr>`).join("")}</tbody></table></div>`:`<p class="muted small">Aún no hay criterios.</p>`}
    <div class="row"><select id="dim_${tipo}">${DIMS.map(d=>`<option>${d}</option>`).join("")}</select><button class="btn sm" data-act="addCrit" data-t="${tipo}">Agregar criterio</button></div></div>`;
  return encabezado("protocolo","Protocolo y métodos","Define las reglas antes de cribar. Lo que escribas aquí alimenta el cribado, la lista de verificación y el informe.")+guia("protocolo")+
  `<section class="card"><h2>Criterios de elegibilidad <span class="mono muted small">ítem 5</span></h2>
    <div class="grid3"><label class="f">Año desde${inp("protocolo.desde","2015","number")}</label><label class="f">Año hasta${inp("protocolo.hasta","2025","number")}</label>
    <div class="f"><span style="font-weight:600;font-size:.92rem">Idiomas</span><div class="row">${[["es","Español"],["en","Inglés"],["pt","Portugués"],["fr","Francés"]].map(([k,l])=>`<label class="small"><input type="checkbox" data-act="idioma" data-v="${k}" ${P.idiomas.includes(k)?"checked":""}> ${l}</label>`).join("")}</div></div></div>
    <div class="row"><button class="btn sm" data-act="critSugeridos">Sugerir criterios desde mi pregunta</button></div>
    ${crit("incl","Inclusión")}${crit("excl","Exclusión")}</section>
  <section class="card"><h2>Motivos de exclusión en texto completo</h2><p class="small muted">Se usan como lista desplegable en el cribado y en Excel. Un solo motivo por informe excluido.</p>
    <div class="terms">${P.motivos.map((m,i)=>`<span class="term" style="background:var(--sunk);font-family:var(--f-body)">${esc(m)}<button data-act="delMotivo" data-i="${i}" aria-label="Quitar motivo">×</button></span>`).join("")}</div>
    <div class="row"><input type="text" id="nuevoMotivo" placeholder="Nuevo motivo" style="max-width:340px"><button class="btn sm" data-act="addMotivo">Agregar</button></div></section>
  <section class="card"><h2>Decisiones metodológicas</h2><div class="grid3">
    <label class="f">Revisores en el cribado${sel("protocolo.revisores",["1","2","3"])}</label>
    <label class="f">¿Trabajan de forma independiente?${sel("protocolo.independiente",["Sí","No"])}</label>
    <label class="f">Tipo de síntesis${sel("protocolo.sintesisTipo",["Narrativa (SWiM)","Temática","Metasíntesis cualitativa","Metaanálisis","Mapeo descriptivo (scoping)"])}</label>
    <label class="f">Certeza de la evidencia${sel("protocolo.certeza",["GRADE-CERQual","GRADE","No aplica (revisión de alcance)"])}</label>
    <label class="f">Herramienta de calidad${sel("protocolo.herramienta",HERRAMIENTAS.map(h=>h.id))}<small>${esc(HERRAMIENTAS.find(h=>h.id===P.herramienta)?.uso||"")}</small></label></div></section>
  <section class="card"><h2>Redacción de métodos</h2><p class="small muted">Usa «Texto modelo» para obtener una redacción base a partir de tus decisiones y adáptala. Un método que no aplica también se declara.</p>
    <div class="row"><button class="btn sm" data-act="modelosTodos">Rellenar los vacíos con texto modelo</button></div>
    <div class="grid2">${METODOS.map(([k,it,n])=>`<label class="f"><span><span class="mono muted">${it}</span> · ${n} <button class="btn sm ghost" data-act="modelo" data-k="${k}" type="button">Texto modelo</button></span>${ta("protocolo."+k,"",4)}</label>`).join("")}</div></section>
  <section class="card"><h2>Registro y protocolo <span class="mono muted small">ítems 24a–c</span></h2><div class="grid3">
    <label class="f">Plataforma${sel("protocolo.registro.plataforma",["OSF Registries","PROSPERO","INPLASY","Sin registro"])}</label>
    <label class="f">Número o DOI de registro${inp("protocolo.registro.numero","osf.io/xxxxx o «La revisión no ha sido registrada»")}</label>
    <label class="f">Acceso al protocolo${inp("protocoloUrl","https://osf.io/…")}</label></div>
    <label class="f">Enmiendas al protocolo${ta("protocolo.enmiendas","Ninguna / Se amplió el periodo de búsqueda porque…",2)}</label>
    <p class="small muted">En ciencias sociales se recomienda registrar en <a href="https://osf.io/registries" target="_blank" rel="noopener">OSF Registries</a> antes del cribado.</p></section>`+pie("protocolo");
};

  <div class="row small"><label><input type="checkbox" data-act="opt" data-k="soloArticulos" ${S.opciones.soloArticulos?"checked":""}> Solo artículos (cuando la base lo permite)</label><label><input type="checkbox" data-act="opt" data-k="soloOA" ${S.opciones.soloOA?"checked":""}> Solo acceso abierto (OpenAlex)</label><span class="muted">Periodo e idiomas se toman del protocolo: ${S.protocolo.desde}–${S.protocolo.hasta} · ${S.protocolo.idiomas.join(", ")}</span></div>

  <section class="card"><h2>Bases de datos</h2><p class="small muted"><b>API</b>: abre la consulta, copia el JSON (Ctrl+A, Ctrl+C) y pégalo en Importar registros, o usa «Importar directo». <b>Web</b>: busca y exporta RIS, BibTeX o CSV. <b>Suscripción</b>: cadena lista para tu acceso institucional.</p>
  <div class="grid2">${BASES.map(b=>{const q=cadena(b.estilo);const url=q?b.url(q,opcionesBusq()):"";

/* ---------- Cribado título/resumen ---------- */
let filtroTA="pend", recActual=null, filtroFT="pend";
VISTAS.cribado=()=>{
  const c=cuentas(),k=kappa();const hechos=c.cribados-c.pendTA;
  return encabezado("cribado","Cribado por título y resumen","Decide con los criterios del protocolo. Ante la duda, incluye: se resolverá con el texto completo.")+guia("cribado")+
  `<section class="card"><div class="row" style="justify-content:space-between"><div class="row"><span class="chip ok">${c.cribados-c.excTA-c.pendTA} incluidos</span><span class="chip bad">${c.excTA} excluidos</span><span class="chip warn">${c.pendTA} pendientes o en duda</span>${k?`<span class="chip acc">κ = ${k.k.toFixed(2)} (${k.interp}, n = ${k.n})</span>`:""}</div>
    <div class="row"><button class="btn sm" data-act="excel">Exportar cribado a Excel</button><button class="btn sm" data-act="importExcel">Importar Excel revisado</button></div></div>
    <div class="progress"><i style="width:${c.cribados?hechos/c.cribados*100:0}%"></i></div>

      <li>Ábrelo en Excel con el complemento Claude en Excel y pídele, por ejemplo: «Resume los motivos de exclusión de la columna K» o «Señala filas con Decisión R1 = Duda y explica qué criterio está en juego». Las decisiones las tomas tú.</li>
      <li>Para doble cribado, comparte el archivo: el segundo revisor completa «Decisión R2» sin ver tu columna (puedes ocultarla).</li>
      <li>Reimporta el libro aquí: se actualizan tus decisiones, el consenso y el coeficiente kappa.</li></ol></details></section>
  ${c.cribados?`<section class="scr"><div style="display:grid;gap:8px"><div class="seg" role="group" aria-label="Filtro">${[["pend","Pendientes"],["Incluir","Incluidos"],["Excluir","Excluidos"],["Duda","Duda"],["todos","Todos"]].map(([k,l])=>`<button data-act="filtroTA" data-v="${k}" aria-pressed="${filtroTA===k}">${l}</button>`).join("")}</div><div class="rlist" id="rlist"></div></div><div id="recBox"></div></section>`:`<div class="empty">No hay registros para cribar. Importa resultados primero.</div>`}`+pie("cribado");
};
function listaTA(){return S.registros.filter(r=>!r.rm&&r.origen!=="otros").filter(r=>{const d=decTA(r);return filtroTA==="todos"?true:filtroTA==="pend"?(!d):d===filtroTA})}
POST.cribado=()=>{if(!$("#rlist"))return;const L=listaTA();if(!recActual||!L.find(r=>r.id===recActual))recActual=L[0]?.id||null;pintarListaTA();pintarRec()};
function pintarListaTA(){const L=listaTA();$("#rlist").innerHTML=L.length?L.slice(0,400).map(r=>`<button class="ritem" data-sel="${r.id}" aria-current="${r.id===recActual}"><span class="dot ${decTA(r)}"></span><span><span class="t" data-noi18n>${esc(r.titulo)}</span><span class="m">${esc(r.anio)} · ${esc(clip(r.fuente,22))}</span></span></button>`).join(""):`<div class="empty small">Nada en este filtro.</div>`}
function pintarRec(){
  const box=$("#recBox");if(!box)return;const r=recById(recActual);
  if(!r){box.innerHTML=`<div class="card"><p>No hay registros en este filtro. ${filtroTA==="pend"?"¡Terminaste el cribado por título y resumen! Revisa los casos en duda y continúa con Texto completo.":""}</p></div>`;return}
  const rx=regexBloques();const d=r.ta.d||"";const L=listaTA();const pos=L.findIndex(x=>x.id===r.id);
  box.innerHTML=`<article class="card rec"><div class="row small muted" style="justify-content:space-between"><span class="mono">${r.id} · ${pos+1} de ${L.length}</span><span><span class="kbd">I</span> incluir <span class="kbd">E</span> excluir <span class="kbd">D</span> duda <span class="kbd">↑</span><span class="kbd">↓</span> mover</span></div>
   <h3 data-noi18n>${resaltar(r.titulo,rx)}</h3><div class="small muted" data-noi18n>${esc(r.autores)} · ${esc(r.anio)} · ${esc(r.revista||r.fuente)}${r.doi?` · <a href="https://doi.org/${esc(r.doi)}" target="_blank" rel="noopener">doi.org/${esc(r.doi)}</a>`:r.url?` · <a href="${esc(r.url)}" target="_blank" rel="noopener">enlace</a>`:""}</div>
   <div class="abs" ${r.resumen?"data-noi18n":""}>${r.resumen?resaltar(r.resumen,rx):'<span class="muted">Sin resumen. Decide por el título o marca «Duda» y revisa el texto completo.</span>'}</div>
   <div class="row small">${S.bloques.map((b,i)=>`<span class="chip"><span class="sw" style="background:var(--b${i%4+1})"></span>${esc(b.nombre)}</span>`).join("")}</div>
   ${r.ia?.sugerencia?`<div class="sugg"><b>Sugerencia del tutor: ${esc(r.ia.sugerencia)}</b>${r.ia.criterio?` · ${esc(r.ia.criterio)}`:""}<br>${esc(r.ia.justificacion||"")}<div class="small muted">Orientativa. La decisión es tuya.</div></div>`:""}
   <div class="row"><button class="btn inc ${d==="Incluir"?"on":""}" data-act="decTA" data-v="Incluir">Incluir</button><button class="btn exc ${d==="Excluir"?"on":""}" data-act="decTA" data-v="Excluir">Excluir</button><button class="btn dud ${d==="Duda"?"on":""}" data-act="decTA" data-v="Duda">Duda</button><span style="flex:1"></span><button class="btn sm" data-act="iaTA" id="iaBtn">Pedir sugerencia al tutor</button></div>
   ${d==="Excluir"?`<label class="f">Motivo (opcional en esta fase)<select data-rec="${r.id}" data-recbind="ta.motivo"><option value="">—</option>${S.protocolo.motivos.map(m=>`<option ${r.ta.motivo===m?"selected":""}>${esc(m)}</option>`).join("")}</select></label>`:""}
   <label class="f">Nota<input type="text" data-rec="${r.id}" data-recbind="ta.nota" value="${esc(r.ta.nota||"")}" placeholder="Por qué decidiste así"></label>
   ${r.ta.r2?`<p class="small">Segundo revisor: <b>${esc(r.ta.r2)}</b>${r.ta.cons?` · Consenso: <b>${esc(r.ta.cons)}</b>`:""}</p>`:""}
   <details class="small"><summary style="cursor:pointer">Criterios del protocolo</summary><div class="grid2" style="margin-top:8px"><div><b>Inclusión</b><ul>${S.protocolo.incl.map(c=>`<li>${esc(c.dim)}<span>: ${esc(c.texto)}</span></li>`).join("")||"<li>Sin definir</li>"}</ul></div><div><b>Exclusión</b><ul>${S.protocolo.excl.map(c=>`<li>${esc(c.dim)}<span>: ${esc(c.texto)}</span></li>`).join("")||"<li>Sin definir</li>"}</ul></div></div></details></article>`;
}
function moverTA(delta){const L=listaTA();if(!L.length)return;let i=L.findIndex(r=>r.id===recActual);i=Math.max(0,Math.min(L.length-1,(i<0?0:i)+delta));recActual=L[i].id;pintarListaTA();pintarRec();$(`[data-sel="${recActual}"]`)?.scrollIntoView({block:"nearest"})}
function decidirTA(v){
  const r=recById(recActual);if(!r)return;const L0=listaTA();const i0=L0.findIndex(x=>x.id===r.id);
  r.ta.d=r.ta.d===v?"":v; if(r.ta.cons) r.ta.cons=""; guardar();
  const L=listaTA();
  if(!L.find(x=>x.id===r.id)||v!=="Excluir") { const nx=L[Math.min(i0,L.length-1)]; if(r.ta.d && v!=="Excluir") recActual=(L.find((x,idx)=>idx>=i0&&x.id!==r.id)||nx||{}).id||null; else if(!L.find(x=>x.id===r.id)) recActual=nx?.id||null; }
  pintarListaTA();pintarRec();renderNav();actualizarChipsTA();
}
function actualizarChipsTA(){const c=cuentas();const chips=$$(".card .chip",$("#view")).slice(0,3);if(chips.length===3){chips[0].textContent=`${c.cribados-c.excTA-c.pendTA} incluidos`;chips[1].textContent=`${c.excTA} excluidos`;chips[2].textContent=`${c.pendTA} pendientes o en duda`}const pi=$("#view .progress>i");if(pi)pi.style.width=(c.cribados?(c.cribados-c.pendTA)/c.cribados*100:0)+"%"}

/* ---------- Texto completo ---------- */

  return pool.filter(r=>filtroFT==="todos"?true:filtroFT==="pend"?(!r.ft.rec||(r.ft.rec==="Sí"&&!r.ft.d)):filtroFT==="Incluir"?r.ft.d==="Incluir"&&r.ft.rec==="Sí":filtroFT==="Excluir"?r.ft.d==="Excluir"&&r.ft.rec==="Sí":r.ft.rec==="No")}

  <div class="seg" role="group">${[["pend","Pendientes"],["Incluir","Incluidos"],["Excluir","Excluidos"],["norec","No recuperados"],["todos","Todos"]].map(([k,l])=>`<button data-act="filtroFT" data-v="${k}" aria-pressed="${filtroFT===k}">${l}</button>`).join("")}</div>
  ${L.length?L.slice(0,200).map(r=>{const doiU=r.doi?`https://doi.org/${r.doi}`:r.url;return `<div class="blk"><div class="row" style="justify-content:space-between;align-items:flex-start"><div style="min-width:0;flex:1"><b data-noi18n>${esc(r.titulo)}</b><div class="small muted" data-noi18n>${esc(clip(r.autores,90))} · ${esc(r.anio)} · <span class="mono">${r.id}</span>${r.origen==="otros"?" · otros métodos":""}</div></div>
    <div class="row">${doiU?`<a class="btn sm" href="${esc(doiU)}" target="_blank" rel="noopener">Abrir</a>`:""}<a class="btn sm" href="https://core.ac.uk/search?q=${encodeURIComponent('"'+r.titulo+'"')}" target="_blank" rel="noopener">Buscar en CORE</a>${r.oa?`<a class="btn sm" href="${esc(r.oa)}" target="_blank" rel="noopener">PDF abierto</a>`:""}</div></div>
    <div class="grid3"><label class="f">¿Texto recuperado?<select data-rec="${r.id}" data-recbind="ft.rec" data-rr="1"><option value="">—</option><option ${r.ft.rec==="Sí"?"selected":""}>Sí</option><option ${r.ft.rec==="No"?"selected":""}>No</option></select></label>
    ${r.ft.rec==="Sí"?`<label class="f">Decisión<select data-rec="${r.id}" data-recbind="ft.d" data-rr="1"><option value="">—</option><option ${r.ft.d==="Incluir"?"selected":""}>Incluir</option><option ${r.ft.d==="Excluir"?"selected":""}>Excluir</option></select></label>`:""}
    ${r.ft.d==="Excluir"&&r.ft.rec==="Sí"?`<label class="f">Motivo único<select data-rec="${r.id}" data-recbind="ft.motivo" data-rr="1"><option value="">—</option>${S.protocolo.motivos.map(m=>`<option ${r.ft.motivo===m?"selected":""}>${esc(m)}</option>`).join("")}</select></label>`:""}
    ${r.ft.d==="Incluir"&&r.ft.rec==="Sí"?`<label class="f">Informe adicional del estudio (ID)<input type="text" data-rec="${r.id}" data-recbind="ft.mismo" value="${esc(r.ft.mismo||"")}" placeholder="Vacío si es un estudio nuevo"></label>`:""}</div>

/* ---------- Diagrama ---------- */
VISTAS.diagrama=()=>{
  const c=cuentas();
  const v=[[c.identDB-c.dup-c.auto-c.otra===c.cribados,`Identificados (${c.identDB}) − eliminados (${c.dup+c.auto+c.otra}) = cribados (${c.cribados})`],
    [c.pendTA===0,`Cribado por título y resumen terminado (${c.pendTA} pendientes o en duda)`],
    [c.cribados-c.excTA-c.pendTA===c.A.buscados,`Cribados (${c.cribados}) − excluidos (${c.excTA}) = buscados (${c.A.buscados})`],
    [c.A.buscados-c.A.noRec-c.A.pend<=c.A.evaluados&&c.A.pend===0,`Buscados (${c.A.buscados}) − no recuperados (${c.A.noRec}) = evaluados (${c.A.evaluados})${c.A.pend?` · ${c.A.pend} pendientes`:""}`],
    [c.A.evaluados-c.A.excluidos===c.A.incluidos.length,`Evaluados (${c.A.evaluados}) − excluidos (${c.A.excluidos}) = incluidos (${c.A.incluidos.length})${c.A.evaluados-c.A.excluidos-c.A.incluidos.length?` · ${c.A.evaluados-c.A.excluidos-c.A.incluidos.length} sin decisión`:""}`],
    [!Object.keys(c.A.motivos).includes("Sin motivo registrado"),"Cada exclusión en texto completo tiene un motivo"]];
  return encabezado("diagrama","Diagrama de flujo PRISMA 2020","Se construye con tus decisiones. Si una comprobación falla, vuelve a la fase indicada.")+guia("diagrama")+
  `<section class="card"><div class="diag" id="diagBox">${svgPrisma(c)}</div><div class="row"><button class="btn sm" data-act="svg">Descargar SVG</button></div></section>
  <section class="card"><h2>Comprobaciones aritméticas</h2><ul class="checks" style="list-style:none;padding:0;margin:0">${v.map(([ok,t])=>`<li><span class="chip ${ok?"ok":"warn"}">${ok?"Cuadra":"Revisar"}</span> ${t}</li>`).join("")}</ul></section>`+pie("diagrama");
};
function cajasPrisma(c){
  const mot=Object.entries(c.A.motivos).map(([m,n])=>`${m} (n = ${n})`);
  const motO=Object.entries(c.otros.motivos).map(([m,n])=>`${m} (n = ${n})`);
  const porBase=Object.entries(c.porBase).map(([k,n])=>`${k} (n = ${n})`);
  const hayOtros=c.otros.ident>0;
  const Bx={id1:["Registros identificados en:",`Bases de datos (n = ${c.identDB})`,...porBase.map(x=>"  "+x)],
    id2:["Registros eliminados antes del cribado:",`Duplicados (n = ${c.dup})`,`Marcados como no elegibles por herramientas de automatización (n = ${c.auto})`,`Eliminados por otras razones (n = ${c.otra})`],
    s1:[`Registros cribados (n = ${c.cribados})`], s2:[`Registros excluidos (n = ${c.excTA})`],
    r1:[`Publicaciones buscadas para su recuperación (n = ${c.A.buscados})`], r2:[`Publicaciones no recuperadas (n = ${c.A.noRec})`],
    e1:[`Publicaciones evaluadas para decidir su elegibilidad (n = ${c.A.evaluados})`], e2:["Publicaciones excluidas:",...(mot.length?mot:["(n = 0)"])],
    inc:[`Nuevos estudios incluidos en la revisión (n = ${c.incluidosEst})`,`Informes de los nuevos estudios incluidos (n = ${c.incluidosInf})`],
    o1:["Registros identificados en:",`Otros métodos (n = ${c.otros.ident})`], o2:[`Publicaciones buscadas para su recuperación (n = ${c.otros.buscados})`], o3:[`Publicaciones no recuperadas (n = ${c.otros.noRec})`],
    o4:[`Publicaciones evaluadas para decidir su elegibilidad (n = ${c.otros.evaluados})`], o5:["Publicaciones excluidas:",...(motO.length?motO:["(n = 0)"])]};
  Object.keys(Bx).forEach(k=>Bx[k]=Bx[k].map(l=>tr(l)));return {hayOtros,...Bx};
}
function wrapLines(lines,max){const out=[];lines.forEach(l=>{const ind=l.startsWith("  ")?"  ":"";let words=l.trim().split(" "),cur=ind;words.forEach(w=>{if((cur+w).length>max&&cur.trim()){out.push(cur.trimEnd());cur=ind+"  "}cur+=w+" "});out.push(cur.trimEnd())});return out}
function layoutPrisma(c){
  const B=cajasPrisma(c);const lh=17,pad=16;
  const X0=56,WL=290,X1=X0+WL+40,WR=300,XO=X1+WR+36,WO=220,XS=XO+WO+30,WS=210;
  const W=B.hayOtros?XS+WS+10:X1+WR+10;
  const ch=(lines,max)=>wrapLines(lines,max).length*lh+pad;
  const rows=[{L:B.id1,R:B.id2,O:B.o1},{L:B.s1,R:B.s2},{L:B.r1,R:B.r2,O:B.o2,OS:B.o3},{L:B.e1,R:B.e2,O:B.o4,OS:B.o5},{L:B.inc}];
  const boxes=[],arrows=[],bands=[];let y=48;const rowY=[];
  rows.forEach((r,i)=>{const hL=ch(r.L,40),hR=r.R?ch(r.R,42):0,hO=B.hayOtros&&r.O?ch(r.O,30):0,hS=B.hayOtros&&r.OS?ch(r.OS,28):0;
    const h=Math.max(hL,hR,hO,hS);rowY.push([y,h,hL,hO]);
    boxes.push({x:X0,y,w:WL,lines:r.L,max:40});
    if(r.R){boxes.push({x:X1,y,w:WR,lines:r.R,max:42});arrows.push([X0+WL,y+hL/2,X1,y+hL/2])}
    if(B.hayOtros&&r.O){boxes.push({x:XO,y,w:WO,lines:r.O,max:30,alt:1})}
    if(B.hayOtros&&r.OS){boxes.push({x:XS,y,w:WS,lines:r.OS,max:28,alt:1});arrows.push([XO+WO,y+hO/2,XS,y+hO/2])}
    y+=h+30});
  for(let i=1;i<rows.length;i++){const [py,,phL]=rowY[i-1];arrows.push([X0+WL/2,py+phL,X0+WL/2,rowY[i][0]])}
  if(B.hayOtros){const oi=[0,2,3];for(let k=1;k<oi.length;k++){const [py,,,phO]=rowY[oi[k-1]];arrows.push([XO+WO/2,py+phO,XO+WO/2,rowY[oi[k]][0]])}
    const [py,,,phO]=rowY[3];const [iy,,ihL]=rowY[4];arrows.push([XO+WO/2,py+phO,XO+WO/2,iy+ihL/2,X0+WL,iy+ihL/2])}
  bands.push(["Identificación",rowY[0][0],rowY[0][0]+rowY[0][1]],["Cribado",rowY[1][0],rowY[3][0]+rowY[3][1]],["Incluidos",rowY[4][0],rowY[4][0]+rowY[4][1]]);
  return {B,W,H:y-10,boxes,arrows,bands,lh,X0,X1,WR,XO,WO,XS,WS};
}
function svgPrisma(c){
  const Lo=layoutPrisma(c);const css=`font-family:'Source Sans 3',Arial,sans-serif;font-size:13px;fill:var(--ink)`;const parts=[];
  parts.push(`<rect x="${Lo.X0}" y="4" width="${Lo.X1+Lo.WR-Lo.X0}" height="30" rx="4" fill="var(--accent-soft)"/><text x="${Lo.X0+10}" y="24" style="${css};font-weight:700">Identificación de estudios a través de bases de datos y registros</text>`);
  if(Lo.B.hayOtros)parts.push(`<rect x="${Lo.XO}" y="4" width="${Lo.XS+Lo.WS-Lo.XO}" height="30" rx="4" fill="var(--sunk)"/><text x="${Lo.XO+10}" y="24" style="${css};font-weight:700">Identificación de estudios a través de otros métodos</text>`);
  Lo.boxes.forEach(b=>{const L=wrapLines(b.lines,b.max);const h=L.length*Lo.lh+16;parts.push(`<rect x="${b.x}" y="${b.y}" width="${b.w}" height="${h}" rx="4" fill="${b.alt?"var(--sunk)":"var(--surface)"}" stroke="var(--ink)" stroke-width="1"/>`);L.forEach((t,i)=>parts.push(`<text x="${b.x+10}" y="${b.y+20+i*Lo.lh}" style="${css}" xml:space="preserve">${esc(t)}</text>`))});
  Lo.arrows.forEach(a=>{const pts=[];for(let i=0;i<a.length;i+=2)pts.push(a[i]+","+a[i+1]);parts.push(`<polyline points="${pts.join(" ")}" fill="none" stroke="var(--ink)" stroke-width="1.2" marker-end="url(#ah)"/>`)});
  Lo.bands.forEach(([n,y1,y2])=>parts.push(`<rect x="8" y="${y1}" width="32" height="${y2-y1}" rx="4" fill="var(--accent)"/><text transform="translate(29 ${(y1+y2)/2}) rotate(-90)" text-anchor="middle" style="font-family:'Source Sans 3',Arial,sans-serif;font-size:13px;font-weight:700;fill:var(--accent-ink)">${n}</text>`));
  return `<svg viewBox="0 0 ${Lo.W} ${Lo.H}" role="img" aria-label="Diagrama de flujo PRISMA 2020"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="var(--ink)"/></marker></defs>${parts.join("")}</svg>`;
}

function faq(q){const n=q.toLowerCase();const hit=FAQ.find(([re])=>re.test(n));return tr(hit?hit[1]:"El tutor con IA no está disponible en esta vista, así que respondo con la guía integrada. Revisa la «Guía de la fase» en la parte superior de cada paso: incluye objetivo, pasos, un ejemplo resuelto y errores frecuentes. Prueba a preguntar por: PICO, cadena de búsqueda, duplicados, kappa, calidad, síntesis, diagrama o registro.")}
function md(t){
  const lines=esc(t).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/(^|[^*])\*(?!\s)(.+?)\*/g,"$1<i>$2</i>").split(/\n/);let out="",list=null;
  lines.forEach(l=>{const ul=l.match(/^\s*[-•]\s+(.*)/),ol=l.match(/^\s*\d+[.)]\s+(.*)/);
    if(ul||ol){const tag=ul?"ul":"ol";if(list!==tag){if(list)out+=`</${list}>`;out+=`<${tag}>`;list=tag}out+=`<li>${(ul||ol)[1]}</li>`}
    else{if(list){out+=`</${list}>`;list=null}if(l.trim())out+=`<p>${l.replace(/^#+\s*/,"")}</p>`}});
  if(list)out+=`</${list}>`;return out;
}

  modelosTodos:()=>{METODOS.forEach(([k])=>{if(!S.protocolo[k])S.protocolo[k]=modelo(k)});guardar();render();toast("Texto modelo agregado en los campos vacíos. Adáptalo a tu revisión.")},
  bloquesDesdePregunta:()=>{const M=MARCOS[S.marco];const usar=M.campos.filter(f=>!["C","D","R"].includes(f.k)&&(S.campos[f.k]||"").trim());
    if(!usar.length){toast("Primero completa los elementos de tu pregunta.");return}
    usar.forEach(f=>{if(!S.bloques.some(b=>b.nombre.startsWith(f.n)))S.bloques.push({id:uid(),nombre:f.n,terminos:[`"${S.campos[f.k].trim().toLowerCase().slice(0,60)}"`]})});guardar();render();toast("Bloques creados. Agrega sinónimos en cada uno.")},
  addBloque:()=>{S.bloques.push({id:uid(),nombre:"Nuevo concepto",terminos:[]});guardar();render()},
  delBloque:e=>{S.bloques.splice(+e.target.dataset.i,1);guardar();render()},
  addTerm:e=>{const i=+e.target.dataset.i;const inp=$(`.addterm[data-i="${i}"]`);agregarTerminos(i,inp.value)},
  delTerm:e=>{S.bloques[+e.target.dataset.i].terminos.splice(+e.target.dataset.j,1);guardar();render()},
  sinonimos:e=>sugerirSinonimos(+e.target.dataset.i),
  addSug:e=>{const i=+e.target.dataset.i;S.bloques[i].terminos.push(e.target.dataset.t);e.target.remove();guardar();const keep=$("#sug"+i).innerHTML;render();$("#sug"+i).innerHTML=keep},
  opt:e=>{S.opciones[e.target.dataset.k]=e.target.checked;guardar();render()},
  copiar:async e=>{const t=e.target.dataset.txt;try{await navigator.clipboard.writeText(t);toast("Cadena copiada.")}catch{const pre=e.target.closest(".dbcard").querySelector("pre");const r=document.createRange();r.selectNodeContents(pre);const s=getSelection();s.removeAllRanges();s.addRange(r);toast("Texto seleccionado: cópialo con Ctrl+C.")}},
  directo:e=>importarDirecto(e.target.dataset.b),
  tutorCadena:()=>preguntar("Revisa mi estrategia de búsqueda: ¿faltan sinónimos, hay errores de operadores booleanos o de truncamiento, y qué bases abiertas me recomiendas para mi tema?"),
  addLog:()=>{S.log.push({id:uid(),base:$("#lgBase").value,fecha:$("#lgFecha").value,cadena:$("#lgCad").value,filtros:$("#lgFil").value,n:+$("#lgN").value||0,origen:"db",fmt:"manual"});guardar();render()},
  delLog:e=>{S.log.splice(+e.target.dataset.i,1);guardar();render()},
  subir:()=>{const f=$("#fileIn");f.accept=".ris,.bib,.csv,.txt,.json,.tsv";f.onchange=()=>{if(f.files[0])leerArchivoImport(f.files[0]);f.value=""};f.click()},
  importar:()=>{try{const res=detectar($("#impTxt").value);if(!res.respaldo&&!res.items.length)throw new Error("No se encontraron registros en el contenido.");incorporar(res,{baseId:$("#impBase").value,origen:$("#impOrigen").value,fecha:$("#impFecha").value||hoy()})}catch(e){$("#impMsg").innerHTML=`<div class="sugg" style="border-color:var(--bad)">${esc(e.message||String(e))}</div>`}},
  dedup:()=>{const n=marcarDuplicados();guardar();render();toast(`${n} duplicados marcados.`)},
  manual:()=>{$("#manualForm").innerHTML=`<div class="blk"><div class="grid2"><label class="f">Título<input type="text" id="mT"></label><label class="f">Autores<input type="text" id="mA"></label><label class="f">Año<input type="text" id="mY"></label><label class="f">DOI o URL<input type="text" id="mD"></label></div><label class="f">Resumen<textarea id="mR" rows="2"></textarea></label><div class="row"><label class="f">Origen<select id="mO"><option value="otros">Otros métodos (citas, sitios web, expertos)</option><option value="db">Base de datos</option></select></label><button class="btn sm pri" data-act="guardarManual">Agregar</button></div></div>`},
  guardarManual:()=>{const d=$("#mD").value.trim();const r=reg({titulo:$("#mT").value,autores:$("#mA").value,anio:$("#mY").value,doi:/^10\.|doi\.org/.test(d)?d:"",url:/^http/.test(d)&&!/doi\.org/.test(d)?d:"",resumen:$("#mR").value});
    if(!$("#mT").value.trim()){toast("Escribe al menos el título.");return}r.id="R"+String(siguienteId()).padStart(4,"0");r.origen=$("#mO").value;r.fuente=r.origen==="otros"?"Búsqueda de citas / otros":"Manual";S.registros.push(r);marcarDuplicados();guardar();render();toast("Registro agregado.")},
  filtroTA:e=>{filtroTA=e.target.dataset.v;recActual=null;render()},
  decTA:e=>decidirTA(e.target.dataset.v),
  iaTA:iaCribado,
  excel:exportarExcel,
  importExcel:()=>{const f=$("#fileIn");f.accept=".xlsx";f.onchange=()=>{if(f.files[0])importarExcel(f.files[0]);f.value=""};f.click()},
  filtroFT:e=>{filtroFT=e.target.dataset.v;render()},
  addTema:()=>{S.sintesis.temas.push({id:uid(),nombre:"",estudios:[],texto:""});guardar();render()},
  delTema:e=>{S.sintesis.temas.splice(+e.target.dataset.i,1);guardar();render()},
  temaEst:e=>{const t=S.sintesis.temas[+e.target.dataset.i],id=e.target.dataset.id;e.target.checked?t.estudios.includes(id)||t.estudios.push(id):t.estudios.splice(t.estudios.indexOf(id),1);guardar()},
  tutorTema:e=>{const t=S.sintesis.temas[+e.target.dataset.i];const est=t.estudios.map(id=>{const r=recById(id);return r?`${r.autores.split(";")[0]} (${r.anio}) · ${r.ext.disenio||"diseño sin registrar"} · hallazgos: ${clip(r.ext.hallazgos,300)||"sin extraer"}`:""}).join("\n");
    preguntar(`Ayúdame a sintetizar el tema «${t.nombre}». Estudios asignados y lo que extraje:\n${est||"(ninguno asignado)"}\nMi borrador: ${t.texto||"(vacío)"}\n¿Cómo integro estos hallazgos siguiendo SWiM sin resumir estudio por estudio?`)},
  addCerteza:()=>{S.sintesis.certezas.push({desenlace:"",nivel:"Moderada",just:""});guardar();render()},
  delCerteza:e=>{S.sintesis.certezas.splice(+e.target.dataset.i,1);guardar();render()},
  svg:()=>{const el=$("#diagBox svg").cloneNode(true);const cs=getComputedStyle(document.documentElement);let s=new XMLSerializer().serializeToString(el);
    s=s.replace(/var\(--([a-z0-9-]+)\)/g,(m,n)=>cs.getPropertyValue("--"+n).trim()||"#000");if(!/xmlns=/.test(s))s=s.replace("<svg",'<svg xmlns="http://www.w3.org/2000/svg"');
    descargar(`diagrama-prisma-${nombreBase()}.svg`,s)},
  aceptarSug:()=>{CHECK.forEach(([,it])=>{const e=estadoItem(it);if(!e.final&&e.sug==="Reportado")S.checklist[it]={...(S.checklist[it]||{}),estado:"Reportado"}});guardar();render()},
  tutorResumen:async()=>{const box=$("#resumenBox");if(!sampleFn){box.innerHTML=`<p class="small muted">El tutor con IA no está disponible. Redacta el resumen con los 12 ítems de la tabla: objetivos, criterios, fuentes con fecha, riesgo de sesgo, síntesis, estudios incluidos, resultados, limitaciones, interpretación, financiación y registro.</p>`;return}
    box.innerHTML=`<p class="small muted">Redactando…</p>`;
    try{const c=cuentas();const {text}=await sampleFn(`${IDIOMA_TUTOR[LANG]} Redacta un borrador de resumen estructurado (máx. 300 palabras) que cumpla los 12 ítems de PRISMA 2020 para resúmenes, con los apartados Objetivo, Métodos, Resultados, Conclusiones, Financiación y Registro. Usa SOLO estos datos; donde falte información escribe [COMPLETAR]. No inventes cifras ni estudios.\nDatos: ${contexto()}\nTemas de síntesis: ${JSON.stringify(S.sintesis.temas.map(t=>({tema:t.nombre,n:t.estudios.length,texto:clip(t.texto,500)})))}\nCerteza: ${JSON.stringify(S.sintesis.certezas)}\nFinanciación: ${S.otros.financiacion}\nRegistro: ${S.protocolo.registro.plataforma} ${S.protocolo.registro.numero}\nFecha última búsqueda: ${S.log.map(l=>l.fecha).sort().pop()||"[COMPLETAR]"}\nEstudios incluidos: ${c.incluidosEst}`,{onText:({text})=>{box.innerHTML=`<div class="sugg">${md(text)}</div>`}});
      box.innerHTML=`<div class="sugg">${md(text)}<div class="small muted">Borrador generado por el tutor: verifica cada dato antes de usarlo.</div></div>`}catch(e){box.innerHTML=`<p class="small muted">No se pudo generar ahora (${esc(e?.code||"error")}).</p>`}},
  secSel:e=>{secSel[e.target.dataset.k]=e.target.checked},
  pdf:generarPDF
};
function agregarTerminos(i,txt){const ts=txt.split(/\s*;\s*|\s*\n\s*/).map(t=>t.trim()).filter(Boolean);if(!ts.length)return;ts.forEach(t=>{if(!S.bloques[i].terminos.includes(t))S.bloques[i].terminos.push(t)});guardar();render();$(`.addterm[data-i="${i}"]`)?.focus()}

/* ================= Eventos ================= */
document.addEventListener("click",e=>{
  const lg=e.target.closest("[data-lang]");if(lg){cambiarIdioma(lg.dataset.lang);return}
  const go=e.target.closest("[data-go]");if(go){ir(go.dataset.go);return}
  const op=e.target.closest("[data-open]");if(op){abrirProyecto(op.dataset.open);return}
  const sel=e.target.closest("[data-sel]");if(sel){recActual=sel.dataset.sel;pintarListaTA();pintarRec();return}
  const q=e.target.closest("[data-q]");if(q){preguntar(q.dataset.q);return}
  const a=e.target.closest("[data-act]");if(a&&ACT[a.dataset.act]&&!(a.tagName==="INPUT"&&a.type==="checkbox")){ACT[a.dataset.act]({target:a,preventDefault:()=>e.preventDefault()})}
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.matches('input[type=checkbox][data-act]')&&ACT[t.dataset.act]){ACT[t.dataset.act]({target:t});return}
  if(t.dataset.rec){const r=recById(t.dataset.rec);if(!r)return;setPath(r,t.dataset.recbind,t.value);guardar();
    if(t.dataset.rr||t.dataset.recbind==="rm"){if(t.dataset.recbind==="rm"){renderNav()}else{const y=$("#main").scrollTop;render();$("#main").scrollTop=y}}
    else if(t.dataset.recbind.startsWith("cal.")||t.dataset.recbind==="ext.disenio")renderNav();return}
  if(t.dataset.bind&&t.tagName==="SELECT"){setPath(S,t.dataset.bind,t.value);guardar();if(/^protocolo\.(herramienta|sintesisTipo|certeza)|^meta\.tipo/.test(t.dataset.bind)){const y=$("#main").scrollTop;render();$("#main").scrollTop=y}else renderNav()}
});
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.dataset.rec&&t.tagName!=="SELECT"){const r=recById(t.dataset.rec);if(r){setPath(r,t.dataset.recbind,t.value);guardar()}return}
  if(t.dataset.bind&&t.tagName!=="SELECT"){let v=t.value;if(t.type==="number")v=v===""?"":+v;setPath(S,t.dataset.bind,v);guardar();
    if(t.dataset.bind.startsWith("campos.")){const g=$("#qGen");if(g)g.textContent=MARCOS[S.marco].plantilla(S.campos)}
    if(vistaActual==="pregunta")rubricaPregunta();
    if(t.dataset.bind==="meta.titulo")$("#projName").textContent=S.meta.titulo||"Proyecto sin título"}
});
document.addEventListener("focusout",e=>{if(e.target.dataset?.bind&&/^(protocolo\.(desde|hasta)|bloques\.\d+\.nombre)/.test(e.target.dataset.bind)){renderNav()}});
document.addEventListener("keydown",e=>{
  if(e.target.classList?.contains("addterm")&&e.key==="Enter"){e.preventDefault();agregarTerminos(+e.target.dataset.i,e.target.value);return}
  if(e.target.id==="ask"&&e.key==="Enter"&&!e.shiftKey){e.preventDefault();$("#composeForm").requestSubmit();return}
  if(vistaActual!=="cribado"||/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)||e.metaKey||e.ctrlKey||e.altKey||$("#tutor").classList.contains("open"))return;
  const k=e.key.toLowerCase();
  if(k==="i"){decidirTA("Incluir");e.preventDefault()}else if(k==="e"){decidirTA("Excluir");e.preventDefault()}else if(k==="d"){decidirTA("Duda");e.preventDefault()}
  else if(e.key==="ArrowDown"||k==="j"){moverTA(1);e.preventDefault()}else if(e.key==="ArrowUp"||k==="k"){moverTA(-1);e.preventDefault()}
});
$("#composeForm").addEventListener("submit",e=>{e.preventDefault();const v=$("#ask").value;$("#ask").value="";preguntar(v)});
$("#stopBtn").onclick=()=>ctlChat?.abort();
$("#topTutor").onclick=()=>$("#tutor").classList.contains("open")?cerrarTutor():abrirTutor();
$("#fab").onclick=abrirTutor;$("#tutorClose").onclick=cerrarTutor;
$("#tutorClear").onclick=()=>{S.chat=[];guardar();pintarChat()};
$("#topPdf").onclick=()=>ir("informe");
$("#topHome").onclick=()=>ir("proyectos");
$("#navToggle").onclick=()=>{const s=$("#side");const o=s.classList.toggle("open");$("#navToggle").setAttribute("aria-expanded",String(o))};
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&$("#tutor").classList.contains("open"))cerrarTutor()});

/* ================= Arranque ================= */
(async()=>{
  iniciarI18n();
  await iniciarAlmacen();
  try{if(window.claude?.use){const s=await claude.use("sample");if(s){sampleFn=s;$("#tutorMode").textContent="Profesor virtual con IA · conoce tu proyecto"}else $("#tutorMode").textContent="Guía integrada (sin IA en esta vista)"}else $("#tutorMode").textContent="Guía integrada (sin IA en esta vista)"}catch{}
})();


</script>
