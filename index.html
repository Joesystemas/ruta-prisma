<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Ruta PRISMA: entorno instruccional para revisiones sistemáticas PRISMA 2020 con PICO en ciencias sociales (ES/EN/Kichwa).">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Ruta PRISMA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,500;7..72,650&family=Source+Sans+3:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: banco de trabajo — riel lateral con el embudo PRISMA en vivo, área de trabajo por fase, tutor en panel lateral */
:root{
  --bg:#F3F6F5; --surface:#FFFFFF; --sunk:#E8EEEC; --ink:#14262B; --muted:#5A6B6F; --line:#D3DDDA;
  --accent:#0E6B66; --accent-ink:#FFFFFF; --accent-soft:#D6ECE9; --focus:#1C8C85;
  --ok:#1F7A3D; --ok-soft:#DCF0E2; --bad:#B3261E; --bad-soft:#F8DEDB; --warn:#9A5B00; --warn-soft:#F7E8CF;
  --b1:#CDEBE6; --b2:#F6E2B8; --b3:#E1DAF5; --b4:#F5D5DE;
  --f-display:"Literata", Georgia, "Times New Roman", serif;
  --f-body:"Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Consolas, monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1A1C; --surface:#162427; --sunk:#1D2F33; --ink:#E4EEEC; --muted:#9AB0B2; --line:#2C4146;
  --accent:#4FC2B8; --accent-ink:#06211F; --accent-soft:#173A38; --focus:#6FD8CE;
  --ok:#6CCB8A; --ok-soft:#173826; --bad:#F08A80; --bad-soft:#3E1D1A; --warn:#E8B35C; --warn-soft:#3A2C12;
  --b1:#1C4A45; --b2:#4A3A15; --b3:#33295A; --b4:#4D2230; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0F1A1C; --surface:#162427; --sunk:#1D2F33; --ink:#E4EEEC; --muted:#9AB0B2; --line:#2C4146;
  --accent:#4FC2B8; --accent-ink:#06211F; --accent-soft:#173A38; --focus:#6FD8CE;
  --ok:#6CCB8A; --ok-soft:#173826; --bad:#F08A80; --bad-soft:#3E1D1A; --warn:#E8B35C; --warn-soft:#3A2C12;
  --b1:#1C4A45; --b2:#4A3A15; --b3:#33295A; --b4:#4D2230; color-scheme:dark }
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.55 var(--f-body);}
h1,h2,h3{font-family:var(--f-display);font-weight:650;text-wrap:balance;line-height:1.2;margin:0}
h1{font-size:1.65rem} h2{font-size:1.35rem} h3{font-size:1.08rem}
p{margin:0}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.mono{font-family:var(--f-mono);font-size:.86em}
.muted{color:var(--muted)}
.small{font-size:.88rem}
.eyebrow{font-size:.74rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700}

/* Shell */
.app{display:grid;grid-template-columns:270px minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);height:100%}
.top{grid-column:1/-1;display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--surface);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand svg{flex:none}
.brand b{font-family:var(--f-display);font-size:1.1rem}
.top .proj{color:var(--muted);font-size:.92rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:36ch}
.top .sp{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 10px;font-size:.8rem;font-weight:600;background:var(--sunk);color:var(--muted);white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.bad{background:var(--bad-soft);color:var(--bad)} .chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.acc{background:var(--accent-soft);color:var(--accent)}
.side{border-right:1px solid var(--line);background:var(--surface);overflow:auto;padding-block:14px;padding-inline:12px}
.main{overflow:auto;padding-block:24px 80px;padding-inline:clamp(16px,3vw,40px);min-width:0}
.wrap{max-width:1060px;margin:0 auto;display:grid;gap:20px}

/* Nav */
.navgrp{margin-bottom:10px}
.navgrp .eyebrow{padding:6px 8px}
.nav{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:none;padding:7px 8px;border-radius:6px;cursor:pointer;color:var(--ink)}
.nav:hover{background:var(--sunk)}
.nav[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:700}
.nav .n{font:600 .74rem var(--f-mono);width:22px;height:22px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--line);flex:none;color:var(--muted)}
.nav .n.done{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.nav .n.part{border-color:var(--accent);color:var(--accent)}
.nav .lbl{flex:1;min-width:0;font-size:.95rem}
.nav .it{font:.7rem var(--f-mono);color:var(--muted)}
.funnel{margin:14px 6px 0;padding:12px;border-radius:var(--r);background:var(--sunk);font-size:.85rem}
.funnel .row{display:flex;justify-content:space-between;gap:8px;padding:3px 0;font-variant-numeric:tabular-nums}
.funnel .bar{height:4px;border-radius:2px;background:var(--accent);margin:2px 0 4px;transition:width .4s}

/* Cards & forms */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:grid;gap:14px;min-width:0}
.head{display:grid;gap:6px}
.head p{color:var(--muted);max-width:72ch}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
label.f{display:grid;gap:4px;font-weight:600;font-size:.92rem}
label.f small{font-weight:400;color:var(--muted)}
input[type=text],input[type=number],input[type=url],input[type=date],select,textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:8px 10px}
textarea{min-height:76px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--focus);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 13px;cursor:pointer;font-weight:600;font-size:.92rem;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.08);color:var(--accent-ink)}
.btn.ghost{border-color:transparent;background:none}
.btn.sm{padding:4px 9px;font-size:.84rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.inc{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.btn.exc{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.btn.dud{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.btn.inc.on{background:var(--ok);color:var(--surface)} .btn.exc.on{background:var(--bad);color:var(--surface)} .btn.dud.on{background:var(--warn);color:var(--surface)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:var(--surface);padding:6px 12px;cursor:pointer;font-weight:600;font-size:.9rem;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}

/* Guide */
details.guide{border:1px solid var(--line);border-radius:var(--r);background:var(--accent-soft);padding:0}
details.guide>summary{cursor:pointer;padding:12px 16px;font-weight:700;color:var(--accent);list-style:none;display:flex;gap:8px;align-items:center}
details.guide>summary::-webkit-details-marker{display:none}
details.guide>summary::before{content:"▸";transition:transform .2s}
details.guide[open]>summary::before{transform:rotate(90deg)}
.gbody{padding:0 16px 16px;display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.gbody h4{margin:0 0 4px;font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.gbody ul,.gbody ol{margin:0;padding-left:1.2em}
.gbody li{margin:2px 0}
.gbody .ex{background:var(--surface);border-radius:6px;padding:10px 12px;font-size:.93rem}

/* Tables */
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{background:var(--sunk);font-weight:700;font-size:.8rem;letter-spacing:.03em;position:sticky;top:0}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}

/* Blocks / terms */
.blk{border:1px solid var(--line);border-radius:var(--r);padding:12px;display:grid;gap:8px;background:var(--bg)}
.blk .bh{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sw{width:12px;height:12px;border-radius:3px;flex:none}
.terms{display:flex;flex-wrap:wrap;gap:6px}
.term{display:inline-flex;align-items:center;gap:4px;border-radius:4px;padding:2px 4px 2px 8px;font:.84rem var(--f-mono)}
.term button{border:0;background:none;cursor:pointer;color:inherit;opacity:.6;padding:0 4px;font-size:1rem;line-height:1}
.and{font:700 .78rem var(--f-mono);color:var(--muted);text-align:center}
pre.q{white-space:pre-wrap;word-break:break-word;background:var(--sunk);border-radius:6px;padding:10px 12px;margin:0;font:.84rem/1.5 var(--f-mono)}

/* Screening */
.scr{display:grid;grid-template-columns:minmax(220px,320px) minmax(0,1fr);gap:16px;align-items:start}
.rlist{max-height:70vh;overflow:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.ritem{display:grid;grid-template-columns:8px minmax(0,1fr);gap:8px;padding:8px 10px;border-bottom:1px solid var(--line);cursor:pointer;width:100%;text-align:left;background:none;border-left:0;border-right:0;border-top:0}
.ritem:hover{background:var(--sunk)}
.ritem[aria-current="true"]{background:var(--accent-soft)}
.ritem .dot{width:8px;height:8px;border-radius:50%;margin-top:7px;background:var(--line)}
.ritem .dot.Incluir{background:var(--ok)} .ritem .dot.Excluir{background:var(--bad)} .ritem .dot.Duda{background:var(--warn)}
.ritem .t{font-size:.88rem;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ritem .m{font-size:.76rem;color:var(--muted)}
.rec h3{font-size:1.15rem}
.abs{max-width:75ch;line-height:1.65}
mark{border-radius:3px;padding:0 2px;color:inherit}
mark.k0{background:var(--b1)} mark.k1{background:var(--b2)} mark.k2{background:var(--b3)} mark.k3{background:var(--b4)}
.kbd{font:600 .72rem var(--f-mono);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;color:var(--muted)}
.sugg{border-left:3px solid var(--accent);background:var(--accent-soft);padding:10px 12px;border-radius:0 6px 6px 0;font-size:.92rem}
.progress{height:8px;border-radius:4px;background:var(--sunk);overflow:hidden}
.progress>i{display:block;height:100%;background:var(--accent);transition:width .4s}

/* Stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.stat{background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.stat b{display:block;font:650 1.5rem var(--f-display);font-variant-numeric:tabular-nums}
.stat span{font-size:.82rem;color:var(--muted)}

/* Route */
.route{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.step{border:1px solid var(--line);border-radius:var(--r);padding:14px;background:var(--surface);display:grid;gap:6px;cursor:pointer;text-align:left}
.step:hover{border-color:var(--accent)}
.step .sn{font:600 .78rem var(--f-mono);color:var(--accent)}
.hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:24px;align-items:center}
.hero p{max-width:62ch}

/* Diagram */
.diag{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:12px}
.diag svg{display:block;min-width:720px;width:100%;height:auto}
.checks li{margin:3px 0}

/* Tutor */
.tutor{position:fixed;right:0;top:0;bottom:0;width:min(420px,100%);background:var(--surface);border-left:1px solid var(--line);display:flex;flex-direction:column;z-index:30;transform:translateX(100%);transition:transform .25s;box-shadow:-8px 0 24px rgba(0,0,0,.08);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.tutor.open{transform:none}
.tutor header{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.msgs{flex:1;overflow:auto;padding:14px;display:grid;gap:10px;align-content:start}
.msg{max-width:92%;padding:9px 12px;border-radius:10px;font-size:.93rem;line-height:1.5;overflow-wrap:anywhere}
.msg.u{justify-self:end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:3px}
.msg.a{justify-self:start;background:var(--sunk);border-bottom-left-radius:3px}
.msg.a ul,.msg.a ol{margin:4px 0;padding-left:1.2em}
.msg.a p+p{margin-top:6px}
.qp{display:flex;gap:6px;flex-wrap:wrap;padding:0 14px 8px}
.qp button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:3px 10px;font-size:.8rem;cursor:pointer}
.qp button:hover{border-color:var(--accent);color:var(--accent)}
.compose{display:flex;gap:8px;padding:10px 14px;border-top:1px solid var(--line)}
.compose textarea{min-height:44px;max-height:140px}
.fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:25;border-radius:999px;padding:12px 18px;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;z-index:50;font-size:.92rem;max-width:90vw}
.drop{border:2px dashed var(--line);border-radius:var(--r);padding:16px;text-align:center;color:var(--muted)}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r)}
.dbcard{border:1px solid var(--line);border-radius:var(--r);padding:12px;display:grid;gap:8px;background:var(--bg);min-width:0}
.dbcard h3{font-family:var(--f-body);font-size:1rem;font-weight:700}
.navtoggle{display:none}
.seg.lang button{padding:3px 9px;font-size:.78rem;font-family:var(--f-mono)}
.app.home{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}
.app.home .side{display:none!important}
.app.home .navtoggle{display:none!important}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:14px}
.pcard{align-content:start;gap:10px}
.pcard .chip{font-size:.76rem}
[hidden]{display:none!important}
.pcard.last{border-color:var(--accent)}
.pcard h3{font-size:1.12rem}
.plink{all:unset;cursor:pointer;color:var(--ink)}
.plink:hover{color:var(--accent);text-decoration:underline}
.plink:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.pq{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}

@media (max-width:860px){
  .app{grid-template-columns:1fr;grid-template-rows:auto auto minmax(0,1fr)}
  .side{border-right:0;border-bottom:1px solid var(--line);padding-block:6px;padding-inline:12px;display:none}
  .side.open{display:block;max-height:60vh}
  .navtoggle{display:inline-flex}
  .scr{grid-template-columns:1fr}
  .rlist{max-height:40vh}
  .hero{grid-template-columns:1fr}
  .top .proj{display:none}
  .fabx{display:none}
  .fab{padding:10px 14px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="app" id="app">
  <header class="top">
    <button class="btn sm navtoggle" id="navToggle" aria-expanded="false" aria-controls="side">Fases</button>
    <div class="brand">
      <svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><path d="M3 4h22l-8 10v8l-6 3V14z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" style="color:var(--accent)"/><path d="M7 8h14" stroke="var(--accent)" stroke-width="2"/></svg>
      <b>Ruta PRISMA</b>
    </div>
    <button class="btn sm" id="topHome" hidden>Mis proyectos</button>
    <span class="proj" id="projName"></span>
    <span class="sp"></span>
    <div class="seg lang" id="langSel" role="group" aria-label="Idioma"></div>
    <span class="chip" id="saveChip" title="Dónde se guarda tu proyecto">Cargando…</span>
    <button class="btn sm" id="topPdf">Informe PDF</button>
    <button class="btn sm pri" id="topTutor">Tutor</button>
  </header>
  <nav class="side" id="side" aria-label="Fases de la revisión"></nav>
  <main class="main" id="main" tabindex="-1"><div class="wrap" id="view"></div></main>
</div>

<aside class="tutor" id="tutor" aria-label="Tutor PRISMA" aria-hidden="true">
  <header>
    <div style="flex:1;min-width:0"><b style="font-family:var(--f-display)">Tutor PRISMA</b><div class="small muted" id="tutorMode">Profesor virtual de metodología</div></div>
    <button class="btn sm ghost" id="tutorClear" title="Nueva conversación">Limpiar</button>
    <button class="btn sm" id="tutorClose" aria-label="Cerrar tutor">Cerrar</button>
  </header>
  <div class="msgs" id="msgs" aria-live="polite"></div>
  <div class="qp" id="quick"></div>
  <form class="compose" id="composeForm">
    <textarea id="ask" rows="2" placeholder="Escribe tu duda sobre esta fase…" aria-label="Pregunta al tutor"></textarea>
    <div style="display:grid;gap:6px"><button class="btn pri" id="sendBtn" type="submit">Enviar</button><button class="btn sm" id="stopBtn" type="button" hidden>Detener</button></div>
  </form>
</aside>
<button class="btn pri fab" id="fab" aria-label="Preguntar al tutor">Preguntar<span class="fabx"> al tutor</span></button>
<input type="file" id="fileIn" hidden>

<script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>

<script>

hikkunamanta ashtawan sinchi tukurikuna."], ["Condición o factor al que están expuestos.", "Condition or factor they are exposed to.", "Imapi kawsashka, ima tiyashkapash."], ["Configura tu proyecto y conoce la ruta.", "Set up your project and get to know the route.", "Proyectota allichiy, ñantapash riksiy."], ["Conflicto de intereses", "Competing interests", "Munaykunapura makanakuy"], ["Conflictos de intereses", "Competing interests", "Munaykunapura makanakuy"], ["Consenso", "Consensus", "Arinishka"], ["Consenso o, si está vacío, Decisión R1", "Consensus or, if empty, Decision R1", "Arinishka, chushak kakpika Decisión R1"], ["Construir una estrategia de búsqueda exhaustiva, documentada y reproducible en bases de libre acceso.", "Build an exhaustive, documented and reproducible search strategy in open-access databases.", "Paskashka willay tantanakuykunapi tukuylla, killkashka, kutin rurana maskana ñanta ruray."], ["Construir una estrategia de búsqueda exhaustiva, documentada y reproducible en bases de l…", "Build an exhaustive, documented and reproducible search strategy in open-access databases.", "Paskashka willay tantanakuykunapi tukuylla, killkashka, kutin rurana maskana ñanta ruray."], ["Construye un bloque por concepto. Dentro del bloque une sinónimos con **OR**; entre bloques usa **AND**. Usa comillas para frases exactas y * para truncar. Incluye términos en español, inglés y portugués si tu tema es latinoamericano. Prueba la cadena: miles de resultados piden más precisión; muy pocos, más sinónimos (ítem 7).", "Build one block per concept. Within a block, join synonyms with **OR**; between blocks use **AND**. Use quotation marks for exact phrases and * for truncation. Include terms in Spanish, English and Portuguese if your topic is Latin American. Test the string: thousands of results call for more precision; very few, for more synonyms (item 7).", "Sapan yuyaypak shuk tantata ruray. Tanta ukupi kikin shina shimikunata **OR** nishkawan tantachiy; tantakunapurapika **AND** nishkata llamkachiy. Kikin rimaykunapakka « » churay, kuchunkapakka * churay. Latinoamericamanta yachay kakpika español, inglés, portugués shimikunapi shimikunata yapay. Maskana shimikunata rikuy: waranka waranka lluksishkakuna kakpika ashtawan allichiy; ashalla kakpika ashtawan shimikunata yapay (7 shuyu)."], ["Consultando ", "Querying ", "Tapukun"], ["Contar votos sin considerar el tamaño y la calidad.", "Vote counting without considering size and quality.", "Hatun kayta, allikaytapash mana rikushpa yupay."], ["Contenido", "Content", "Ukupi tiyak"], ["Contexto / nivel", "Context / level", "Kawsay / patakuna"], ["Contexto no pertinente", "Context not relevant", "Kawsayka mana chimpapuranchu"], ["Continuar donde lo dejé", "Continue where I left off", "Sakishka maypimanta katiy"], ["Copia creada. Estás trabajando en la copia.", "Copy created. You are now working on the copy.", "Shuk shina rurashka. Kunanka chaypimi llamkakunki."], ["Copia y pega el JSON. 100 registros por página; cambia page=2, 3… para más.", "Copy and paste the JSON. 100 records per page; change page=2, 3… for more.", "JSONta kopiay, churaypash. Sapan pankapi 100 killkakuna; ashtawan munashpaka page=2, 3… nishkata shuktachiy."], ["Copiar cadena", "Copy search string", "Maskana shimikunata kopiay"], ["Copiar conclusiones del autor sin datos.", "Copying the authors' conclusions without data.", "Killkakkunapak tukurikunata willaykuna illak kopiay."], ["Crea temas a partir de los desenlaces de tu pregunta: por ejemplo, «Rendimiento académico» y «Motivación».", "Create themes from the outcomes of your question: for example, “Academic achievement” and “Motivation”.", "Kikinpak tapuypak lluksishkakunamanta yuyaykunata ruray: shina «Yachaypi paktay», «Munay»."], ["Crea un bloque de conceptos por elemento de la pregunta (normalmente P, I y O).", "Create one concept block per element of the question (usually P, I and O).", "Tapuypak sapan shuyupak shuk yuyay tantata ruray (P, I, O shina)."], ["Crear bloques desde mi pregunta", "Create blocks from my question", "Ñuka tapuymanta tantakunata ruray"], ["Crear proyecto de ejemplo", "Create example project", "Rikuchik proyectota ruray"], ["Crear y empezar", "Create and start", "Ruray, kallaripash"], ["Cribado", "Screening", "Akllana"], ["Cribado por título y resumen", "Title and abstract screening", "Shutimanta, uchilla killkamanta akllana"], ["Cribados", "Screened", "Akllashka"], ["Cribar", "Screen", "Akllana"], ["Criterio", "Criterion", "Kamachik"], ["Criterios de elegibilidad", "Eligibility criteria", "Akllana kamachikkuna"], ["Criterios de elegibilidad y métodos", "Eligibility criteria and methods", "Akllana kamachikkuna, ñankunapash"], ["Criterios de exclusión que solo niegan los de inclusión.", "Exclusion criteria that merely negate the inclusion criteria.", "Yaykuchina kamachikkunata mana nishkalla anchuchina kamachikkuna."], ["Criterios de inclusión y exclusión (ítem 5)", "Inclusion and exclusion criteria (item 5)", "Yaykuchina, anchuchina kamachikkuna (5 shuyu)"], ["Criterios de inclusión y exclusión.", "Inclusion and exclusion criteria.", "Yaykuchina, anchuchina kamachikkuna."], ["Criterios del protocolo", "Protocol criteria", "Protocolopak kamachikkuna"], ["Criterios sugeridos agregados. Revísalos y escribe su justificación.", "Suggested criteria added. Review them and write their justification.", "Rikuchishka kamachikkuna yapashka. Rikuy, imamanta kashkatapash killkay."], ["Crossref", "Crossref", "Crossref"], ["Crossref no admite operadores booleanos: busca por relevancia con los términos principales. Copia y pega el JSON.", "Crossref does not support Boolean operators: it searches by relevance with the main terms. Copy and paste the JSON.", "Crossrefka booleano rurakkunata mana chaskinchu: hatun shimikunawan ima kashkamanta maskan. JSONta kopiay, churaypash."], ["Cuadra", "Checks out", "Paktan"], ["Cualitativa o mixta", "Qualitative or mixed", "Cualitativo, mixto"], ["Cualitativa, cuantitativa o mixta.", "Qualitative, quantitative or mixed.", "Cualitativo, cuantitativo, mixto."], ["Cualitativo", "Qualitative", "Cualitativo"], ["Cuasiexperimental", "Quasi-experimental", "Cuasiexperimental"], ["Cumple", "Meets", "Paktachin"], ["Cupo compartido de consultas", "Shared query quota", "Rakishka tapuy yupay"], ["Cupo limitado", "Limited quota", "Harkashka yupay"], ["CÓMO USAR ESTE LIBRO", "HOW TO USE THIS WORKBOOK", "KAY KILLKA MAYTUTA IMASHINA LLAMKACHINA"], ["Cómo funciona este entorno", "How this environment works", "Kay llamkana pacha imashina llamkan"], ["Cómo organizar tus proyectos", "How to organise your projects", "Kikinpak proyectokunata imashina allichina"], ["Cómo se calcula", "How it is calculated", "Imashina yupashka"], ["Cómo se recogieron los datos.", "How the data were collected.", "Willaykunata imashina tantachishka."], ["DISCUSIÓN", "DISCUSSION", "RIMANAKUY"], ["DOAJ", "DOAJ", "DOAJ"], ["DOI", "DOI", "DOI"], ["DOI o URL", "DOI or URL", "DOI, URL"], ["Datos del proyecto", "Project details", "Proyectomanta willaykuna"], ["Deben quedar en 0 antes de cerrar el cribado", "Must be 0 before closing screening", "Akllanata manara wichkashpa 0 kana kan"], ["Decide Incluir o Excluir; si excluyes, elige un solo motivo predefinido.", "Decide Include or Exclude; if you exclude, choose a single predefined reason.", "Yaykuchina, Anchuchina akllay; anchuchishpaka shuk ñawpa churashka kamachillata akllay."], ["Decide con los criterios del protocolo. Ante la duda, incluye: se resolverá con el texto completo.", "Decide using the protocol criteria. When in doubt, include: it will be resolved with the full text.", "Protocolopak kamachikkunawan akllay. Iskay yuyay kakpika yaykuchiy: tukuy killkawan allichirinka."], ["Decidir criterios después de ver los resultados.", "Deciding criteria after seeing the results.", "Lluksishkakunata rikushka washa kamachikkunata akllay."], ["Decidir, con los criterios del protocolo, qué registros pasan a lectura de texto completo.", "Decide, using the protocol criteria, which records go on to full-text reading.", "Protocolopak kamachikkunawan, maykan killkakuna tukuy killka killkakatinaman rinkata akllay."], ["Decisiones metodológicas", "Methodological decisions", "Ñanmanta akllaykuna"], ["Decisión", "Decision", "Akllay"], ["Decisión R1", "Decision R1", "Akllay R1"], ["Decisión R2", "Decision R2", "Akllay R2"], ["Declaración explícita de los objetivos o preguntas.", "Explicit statement of the main objectives or questions.", "Hatun munaykunata, tapuykunatapash sut'ita willay."], ["Declare los conflictos de intereses de los autores de la revisión.", "Declare any competing interests of review authors.", "Rikuy killkakkunapak munaykunapura makanakuyta willay."], ["Define las reglas antes de cribar. Lo que escribas aquí alimenta el cribado, la lista de verificación y el informe.", "Define the rules before screening. What you write here feeds the screening, the checklist and the report.", "Manara akllashpa kamachikkunata churay. Kaypi killkashkaka akllanata, rikuna killkata, willachiktapash huntachin."], ["Definir antes del cribado las reglas que seguirás, para que la revisión sea transparente y reproducible.", "Define before screening the rules you will follow, so that the review is transparent and reproducible.", "Manara akllashpa katina kamachikkunata churay, rikuy sut'i, kutin rurana kachun."], ["Definir antes del cribado las reglas que seguirás, para que la revisión sea transparente …", "Define before screening the rules you will follow, so that the review is transparent and reproducible.", "Manara akllashpa katina kamachikkunata churay, rikuy sut'i, kutin rurana kachun."], ["Dejar en blanco la ubicación.", "Leaving the location blank.", "Maypi kashkata chushak sakiy."], ["Descarga cancelada.", "Download cancelled.", "Uraykuchiy sakishka."], ["Descarga el diagrama como imagen SVG o inclúyelo en el informe PDF.", "Download the diagram as an SVG image or include it in the PDF report.", "Shuyuta SVG shuyu shina uraykuchiy, mana kashpaka PDF willachikpi yaykuchiy."], ["Descarga un respaldo .json antes de cada entrega. Puedes importarlo después como proyecto nuevo, en este u otro equipo.", "Download a .json backup before each submission. You can import it later as a new project, on this or another computer.", "Sapan kachaymanta ñawpa .json wakaychikta uraykuchiy. Washaka mushuk proyecto shina apamuy ushanki, kaypi mana kashpaka shuk antawapi."], ["Descargar SVG", "Download SVG", "SVGta uraykuchiy"], ["Descargar respaldo .json", "Download .json backup", ".json wakaychikta uraykuchiy"], ["Describa cualquier método requerido para preparar los datos para su presentación o síntesis, tales como el manejo de los datos perdidos o las conversiones de datos.", "Describe any methods required to prepare the data for presentation or synthesis, such as handling of missing summary statistics or data conversions.", "Willaykunata rikuchinkapak, tantachinkapakpash allichina ñankunata willay, chinkashka willaykunata, tikrachiykunatapash imashina rurashkata."], ["Describa el proceso utilizado para decidir qué estudios eran elegibles para cada síntesis.", "Describe the processes used to decide which studies were eligible for each synthesis.", "Sapan tantachiypak maykan taripaykuna akllana kashkata imashina rikushkata willay."], ["Describa la justificación de la revisión en el contexto del conocimiento existente.", "Describe the rationale for the review in the context of existing knowledge.", "Kunan yachaykunapi rikuypak imamanta kashkata willay."], ["Describa las fuentes de apoyo financiero o no financiero para la revisión y el papel de los financiadores.", "Describe sources of financial or non-financial support for the review, and the role of the funders.", "Rikuypak kullki yanapayta, shuk yanapaykunatapash, yanapakkuna ima rurashkatapash willay."], ["Describa los análisis de sensibilidad que se hayan realizado para evaluar la robustez de los resultados de la síntesis.", "Describe any sensitivity analyses conducted to assess robustness of the synthesised results.", "Tantachishka lluksishkakuna sinchi kashkata rikunkapak rurashka sensibilidad rikuykunata willay."], ["Describa los métodos utilizados para evaluar el riesgo de sesgo debido a resultados faltantes en una síntesis (derivados de los sesgos en las publicaciones).", "Describe any methods used to assess risk of bias due to missing results in a synthesis (arising from reporting biases).", "Tantachiypi chinkashka lluksishkakunamanta sesgo ñankunata imashina chaninchishkata willay (willachiypak sesgokunamanta)."], ["Describa los métodos utilizados para evaluar la certeza (o confianza) en el cuerpo de la evidencia para cada desenlace.", "Describe any methods used to assess certainty (or confidence) in the body of evidence for an outcome.", "Sapan lluksishkapak rikuchikkunapi takyayta imashina chaninchishkata willay."], ["Describa los métodos utilizados para explorar las posibles causas de heterogeneidad entre los resultados de los estudios (por ejemplo, análisis de subgrupos, metarregresión).", "Describe any methods used to explore possible causes of heterogeneity among study results (e.g. subgroup analysis, meta-regression).", "Taripaykunapak lluksishkakuna mana kikin kashkapak imamanta kashkata maskana ñankunata willay (shina, uchilla tantakunata rikuy, metarregresión)."], ["Describa los métodos utilizados para sintetizar los resultados y justifique sus elecciones. Si se ha realizado un metanálisis, describa los modelos, la heterogeneidad y los programas utilizados.", "Describe any methods used to synthesise results and provide a rationale for the choice(s). If meta-analysis was performed, describe the models, heterogeneity and software used.", "Lluksishkakunata tantachinkapak ñankunata willay, imamanta akllashkatapash. Metanálisis rurashka kakpika modelokunata, mana kikin kaykunata, llamkachishka programakunatapash willay."], ["Describa los métodos utilizados para tabular o presentar visualmente los resultados de los estudios individuales y su síntesis.", "Describe any methods used to tabulate or visually display results of individual studies and syntheses.", "Sapan taripaypak lluksishkakunata, tantachiykunatapash tablakunapi, shuyukunapipash imashina rikuchishkata willay."], ["Describa los resultados de los procesos de búsqueda y selección, desde el número de registros identificados hasta el número de estudios incluidos, idealmente con un diagrama de flujo.", "Describe the results of the search and selection process, from the number of records identified in the search to the number of studies included in the review, ideally using a flow diagram.", "Maskaymanta, akllaymanta lluksishkakunata willay, tarishka killkakunamanta yaykuchishka taripaykunakama, alli kakpika flujo shuyuwan."], ["Describa y explique cualquier enmienda a la información proporcionada en el registro o en el protocolo.", "Describe and explain any amendments to information provided at registration or in the protocol.", "Killkachiypi, protocolopipash willashkamanta allichiykunata willay, imamanta kashkatapash."], ["Describe cada elemento con términos observables (quiénes, qué, dónde, qué se mide).", "Describe each element in observable terms (who, what, where, what is measured).", "Sapan shuyuta rikurik shimikunawan willay (pikuna, ima, maypi, ima tupushka)."], ["Descripción", "Description", "Willay"], ["Desde Ruta PRISMA", "From Ruta PRISMA", "Ruta PRISMAmanta"], ["Desenlace", "Outcome", "Lluksishka"], ["Desenlace o hallazgo", "Outcome or finding", "Lluksishka, tarishkapash"], ["Desenlaces buscados", "Outcomes sought", "Maskashka lluksishkakuna"], ["Desenlaces buscados (ítem 10a)", "Outcomes sought (item 10a)", "Maskashka lluksishkakuna (10a shuyu)"], ["Detener", "Stop", "Sayachiy"], ["Diagrama de flujo", "Flow diagram", "Flujo shuyu"], ["Diagrama de flujo PRISMA 2020", "PRISMA 2020 flow diagram", "PRISMA 2020 flujo shuyu"], ["Diagrama de flujo →", "Flow diagram →", "Flujo shuyu →"], ["Dialnet", "Dialnet", "Dialnet"], ["Dimensión", "Dimension", "Kuchu"], ["Discusión", "Discussion", "Rimanakuy"], ["Diseño de estudio no elegible", "Study design not eligible", "Taripay rurana mana akllanachu"], ["Disponibilidad", "Availability", "Tiyay"], ["Disponibilidad de datos y materiales", "Availability of data and materials", "Willaykuna, imakunapash tiyay"], ["Docentes rurales", "Rural teachers", "Chakra llaktakunapi yachachikkuna"], ["Duda", "Unsure", "Iskay yuyay"], ["Duplica para variantes", "Duplicate for variants", "Shuk shina kanata iskaychiy"], ["Duplicado", "Duplicate", "Iskaychishka"], ["Duplicados", "Duplicates", "Iskaychishkakuna"], ["Duplicados eliminados", "Duplicates removed", "Iskaychishkakuna anchuchishka"], ["Duplicar", "Duplicate", "Iskaychiy"], ["Duplicar este proyecto", "Duplicate this project", "Kay proyectota iskaychiy"], ["Dónde se guarda tu proyecto", "Where your project is saved", "Kikinpak proyecto maypi wakaychirin"], ["Dónde se reporta", "Where it is reported", "Maypi willachishka"], ["ERIC", "ERIC", "ERIC"], ["Educación (Departamento de Educación de EE. UU.)", "Education (U.S. Department of Education)", "Yachay (EE. UU. Yachay Ministerio)"], ["Efecto o desenlace de interés.", "Effect or outcome of interest.", "Munashka lluksishka."], ["Ej.:", "E.g.:", "Shina:"], ["Ejemplo resuelto", "Worked example", "Rurashka rikuchik"], ["El CSV no tiene una columna de título reconocible (Title, Título o TI).", "The CSV has no recognisable title column (Title, Título or TI).", "CSVka riksishka shuti columnata mana charinchu (Title, Título, TI)."], ["El JSON parece incompleto. Asegúrate de copiar toda la página (Ctrl+A).", "The JSON seems incomplete. Make sure you copy the whole page (Ctrl+A).", "JSONka mana tukushka shina rikurin. Tukuy pankata kopiay (Ctrl+A)."], ["El archivo no es un respaldo válido de Ruta PRISMA.", "The file is not a valid Ruta PRISMA backup.", "Kay killkaka Ruta PRISMApak alli wakaychik mana kanchu."], ["El coeficiente kappa de Cohen mide el acuerdo entre dos revisores más allá del azar. Exporta el Excel, que el segundo revisor complete «Decisión R2» de forma independiente y reimporta. Valores de 0,61 a 0,80 son sustanciales. Repórtalo en el ítem 8.", "Cohen's kappa coefficient measures agreement between two reviewers beyond chance. Export the Excel, have the second reviewer fill in “Decision R2” independently and re-import. Values from 0.61 to 0.80 are substantial. Report it in item 8.", "Cohen kappaka ishkay rikukkunapura arinishkata tupun, mana yanka tiyashkalla. Excelta kachay, ishkay kati rikuk «Decisión R2» nishkata sapalla huntachichun, kutin apamuy. 0,61 - 0,80 yupaykunaka sinchimi kan. 8 shuyupi willay."], ["El cribado se exporta a un libro de Excel con listas desplegables, columnas para un segundo revisor y fórmulas PRISMA. Puedes abrirlo con Claude en Excel y reimportarlo.", "Screening is exported to an Excel workbook with drop-down lists, columns for a second reviewer and PRISMA formulas. You can open it with Claude in Excel and re-import it.", "Akllanaka Excel killka maytuman kachashka, akllana listakunawan, ishkay kati rikukpak columnakunawan, PRISMA fórmulakunawanpash. Claude in Excelwan paskay, kutin apamuytapash ushanki."], ["El diagrama se construye con tus decisiones. Comprueba que identificados − eliminados = cribados, cribados − excluidos = buscados, y así sucesivamente. Si algo no cuadra, revisa los pendientes del cribado (ítem 16a).", "The diagram is built from your decisions. Check that identified − removed = screened, screened − excluded = sought, and so on. If something does not add up, review the pending screening records (item 16a).", "Shuyuka kikinpak akllaykunawan rurashka. Rikuy: tarishka − anchuchishka = akllashka, akllashka − anchuchishka = maskashka, shinallatak. Mana paktakpika akllanapi shuyakukkunata rikuy (16a shuyu)."], ["El respaldo se importó como un proyecto nuevo. Estás trabajando en él.", "The backup was imported as a new project. You are now working on it.", "Wakaychikka mushuk proyecto shina apamushka. Kunanka chaypimi llamkakunki."], ["El tutor con IA no está disponible en esta vista, así que respondo con la guía integrada. Revisa la «Guía de la fase» en la parte superior de cada paso: incluye objetivo, pasos, un ejemplo resuelto y errores frecuentes. Prueba a preguntar por: PICO, cadena de búsqueda, duplicados, kappa, calidad, síntesis, diagrama o registro.", "The AI tutor is not available in this view, so I am answering with the built-in guide. Check the “Phase guide” at the top of each step: it includes the objective, steps, a worked example and common mistakes. Try asking about: PICO, search string, duplicates, kappa, quality, synthesis, diagram or registration.", "IA yachachikka kay rikuypi mana tiyanchu, chaymanta ukupi tiyak pushakwan kutichini. Sapan nikipak hawapi «Pachapak pushak» nishkata rikuy: munayta, nikikunata, rurashka rikuchikta, pantaykunatapash charin. Kaykunamanta tapuy: PICO, maskana shimikuna, iskaychishkakuna, kappa, allikay, tantachiy, shuyu, killkachiy."], ["El tutor con IA no está disponible en esta vista.", "The AI tutor is not available in this view.", "IA yachachikka kay rikuypi mana tiyanchu."], ["El tutor con IA no está disponible. Piensa en: sinónimos, singular/plural (usa *), siglas y traducciones al inglés y al portugués.", "The AI tutor is not available. Think about: synonyms, singular/plural (use *), acronyms and translations into English and Portuguese.", "IA yachachikka mana tiyanchu. Kaykunapi yuyay: kikin shina shimikuna, shuklla/achka (* llamkachiy), uchillayachishka shutikuna, inglés, portugués shimiman tikrachiykuna."], ["El tutor con IA no está disponible. Redacta el resumen con los 12 ítems de la tabla: objetivos, criterios, fuentes con fecha, riesgo de sesgo, síntesis, estudios incluidos, resultados, limitaciones, interpretación, financiación y registro.", "The AI tutor is not available. Write the abstract using the 12 items in the table: objectives, criteria, sources with dates, risk of bias, synthesis, included studies, results, limitations, interpretation, funding and registration.", "IA yachachikka mana tiyanchu. Tablapak 12 shuyukunawan uchilla killkata killkay: munaykuna, kamachikkuna, punchayuk pukyukuna, sesgo, tantachiy, yaykuchishka taripaykuna, lluksishkakuna, harkaykuna, yuyaychiy, kullki yanapay, killkachiypash."], ["El tutor está buscando sinónimos…", "The tutor is looking for synonyms…", "Yachachikka kikin shina shimikunata maskakun…"], ["Elegibilidad para cada síntesis", "Eligibility for each synthesis", "Sapan tantachiypak akllana"], ["Elegibilidad para cada síntesis (ítem 13a)", "Eligibility for each synthesis (item 13a)", "Sapan tantachiypak akllana (13a shuyu)"], ["Elegibilidad por texto completo", "Full-text eligibility", "Tukuy killkapi akllana"], ["Elemento", "Element", "Shuyu"], ["Elige el marco según el tipo de pregunta: PICO para efectos, PICo o SPIDER para experiencias, PEO para exposiciones, PCC para revisiones de alcance.", "Choose the framework according to the type of question: PICO for effects, PICo or SPIDER for experiences, PEO for exposures, PCC for scoping reviews.", "Tapuy imashina kashkapi marcota akllay: PICO lluksishkakunapak, PICo, SPIDER kawsaykunapak, PEO ima tiyashkapak, PCC alcance rikuykunapak."], ["Elige la herramienta de evaluación de calidad según los diseños esperados.", "Choose the quality appraisal tool according to the expected designs.", "Shuyashka rurakunapi allikay chaninchina antawata akllay."], ["Elige las secciones a incluir.", "Choose the sections to include.", "Yaykuchina rakikunata akllay."], ["Eliminados por otras razones", "Removed for other reasons", "Shuk imamanta anchuchishka"], ["Eliminar", "Delete", "Pichay"], ["Eliminar duplicados a mano sin dejar registro.", "Removing duplicates by hand without keeping a record.", "Iskaychishkakunata makiwan anchuchiy, mana killkashpa."], ["Embudo de la revisión", "Review funnel", "Rikuypak embudo"], ["Embudo en vivo", "Live funnel", "Kawsak embudo"], ["Empezar mi revisión", "Start my review", "Ñuka rikuyta kallariy"], ["En cada bloque agrega sinónimos, variantes y equivalentes en español, inglés y portugués.", "In each block add synonyms, variants and equivalents in Spanish, English and Portuguese.", "Sapan tantapi kikin shina shimikunata, shuktak shinakunata, español, inglés, portugués shimipi kikin shimikunatapash yapay."], ["En ciencias sociales con diseños variados se recomienda **MMAT 2018**; para estudios cualitativos, **CASP** o **JBI**; para cuasiexperimentos, **ROBINS-I**. Explica cuántos revisores evaluaron y si fue independiente (ítem 11) y presenta la valoración por estudio (ítem 18).", "In the social sciences, with varied designs, **MMAT 2018** is recommended; for qualitative studies, **CASP** or **JBI**; for quasi-experiments, **ROBINS-I**. Explain how many reviewers appraised each study and whether they worked independently (item 11), and present the appraisal per study (item 18).", "Runakunapak yachaykunapi shuktak shuktak rurakuna kakpika **MMAT 2018** alli kan; cualitativo taripaykunapak **CASP**, **JBI**; cuasiexperimentokunapak **ROBINS-I**. Mashna rikukkuna chaninchishkata, sapalla rurashkatapash willay (11 shuyu), sapan taripaypak chaninchiytapash rikuchiy (18 shuyu)."], ["En ciencias sociales se recomienda registrar en", "In the social sciences, registration is recommended in", "Runakunapak yachaykunapika kaypi killkachina alli kan:"], ["En los resultados usa «Exportar» → formato RIS o CSV, y sube el archivo.", "In the results use “Export” → RIS or CSV format, and upload the file.", "Lluksishkakunapi «Exportar» → RIS, CSV shinata llamkachiy, killkatapash wichiyachiy."], ["Enmiendas", "Amendments", "Allichiykuna"], ["Enmiendas al protocolo", "Protocol amendments", "Protocolopak allichiykuna"], ["Ensayos aleatorizados (p. ej., experimentos educativos con asignación aleatoria).", "Randomised trials (e.g., educational experiments with random assignment).", "Yanka akllashka taripaykuna (shina, yachaypi yanka rakishka experimentokuna)."], ["Entregar el informe sin el Excel de cribado.", "Submitting the report without the screening Excel.", "Akllana Excel illak willachikta kachay."], ["Entrevistas, grupos focales, etnografía", "Interviews, focus groups, ethnography", "Tapuykuna, uchilla tantanakuykuna, etnografía"], ["Enumere y defina todas las demás variables para las que se buscaron datos (por ejemplo, características de los participantes y de la intervención, fuentes de financiación). Describa todos los supuestos formulados sobre cualquier información ausente o incierta.", "List and define all other variables for which data were sought (e.g. participant and intervention characteristics, funding sources). Describe any assumptions made about any missing or unclear information.", "Willaykuna maskashka tukuy shuk variablekunata killkay, willaypash (shina, yaykukkunapak, ruraypak imashina kay, kullki pukyukuna). Chinkashka, mana sut'i willaykunamanta yuyashkakunata willay."], ["Enumere y defina todos los desenlaces para los que se buscaron los datos. Especifique si se buscaron todos los resultados compatibles con cada dominio del desenlace y, de no ser así, los métodos utilizados para decidir los resultados que se debían recoger.", "List and define all outcomes for which data were sought. Specify whether all results that were compatible with each outcome domain in each study were sought and, if not, the methods used to decide which results to collect.", "Willaykuna maskashka tukuy lluksishkakunata killkay, willaypash. Sapan lluksishka kuchupak tukuy lluksishkakunata maskashkata willay; mana kashpaka maykankunata tantachinata imashina akllashkata willay."], ["Enviar", "Send", "Kachay"], ["Errores frecuentes", "Common mistakes", "Achka pantaykuna"], ["Escribe 1 a 3 objetivos que deriven de la pregunta (ítem 4).", "Write 1 to 3 objectives derived from the question (item 4).", "Tapuymanta lluksik 1 - 3 munaykunata killkay (4 shuyu)."], ["Escribe al menos el título.", "Write at least the title.", "Shutillatapash killkay."], ["Escribe criterios de inclusión y exclusión por dimensión y justifica cada uno.", "Write inclusion and exclusion criteria by dimension and justify each one.", "Sapan kuchupak yaykuchina, anchuchina kamachikkunata killkay, sapanpak imamanta kashkata willay."], ["Escribe un término y pulsa Enter: docen*, \"project-based learning\"", "Type a term and press Enter: docen*, \"project-based learning\"", "Shuk shimita killkay, Enterta llapiy: docen*, \"project-based learning\""], ["Escuelas públicas de Ecuador durante la pandemia de COVID-19", "Public schools in Ecuador during the COVID-19 pandemic", "COVID-19 unkuy pachapi Ecuadorpak llaktapak yachana wasikuna"], ["Especifique los criterios de inclusión y exclusión de la revisión y cómo se agruparon los estudios para la síntesis.", "Specify the inclusion and exclusion criteria for the review and how studies were grouped for the syntheses.", "Rikuypak yaykuchina, anchuchina kamachikkunata, tantachiypak taripaykunata imashina tantachishkatapash willay."], ["Especifique los métodos utilizados para decidir si un estudio cumple con los criterios de inclusión de la revisión, incluyendo cuántos autores de la revisión cribaron cada registro y cada publicación recuperada, si trabajaron de manera independiente y, si procede, los detalles de las herramientas de automatización utilizadas en el proceso.", "Specify the methods used to decide whether a study met the inclusion criteria of the review, including how many reviewers screened each record and each report retrieved, whether they worked independently, and if applicable, details of automation tools used in the process.", "Shuk taripay yaykuchina kamachikkunata paktachishkata imashina akllashkata willay: mashna rikukkuna sapan killkata, sapan tarishka willachiktapash akllashkata, sapalla llamkashkata, kikinllatak llamkak antawakunatapash, tiyakpika."], ["Especifique los métodos utilizados para evaluar el riesgo de sesgo de los estudios incluidos, incluyendo detalles de las herramientas utilizadas, cuántos autores evaluaron cada estudio y si trabajaron de manera independiente.", "Specify the methods used to assess risk of bias in the included studies, including details of the tool(s) used, how many reviewers assessed each study and whether they worked independently.", "Yaykuchishka taripaykunapi sesgota chaninchina ñankunata willay: llamkachishka antawakunata, mashna rikukkuna sapan taripayta chaninchishkata, sapalla llamkashkatapash."], ["Especifique qué elementos están disponibles al público y dónde: formularios de extracción, datos extraídos, datos de los análisis, código y otros materiales.", "Report which of the following are publicly available and where they can be found: data collection forms, data extracted, data used for all analyses, analytic code, any other materials.", "Maykankuna tukuykunapak tiyashkata, maypi tarina kashkatapash willay: willay tantachina killkakuna, hurkushka willaykuna, rikuykunapak willaykuna, código, shuk imakunapash."], ["Especifique todas las bases de datos, registros, sitios web, organizaciones, listas de referencias y otros recursos de búsqueda o consulta para identificar los estudios. Especifique la fecha en la que cada recurso se buscó o consultó por última vez.", "Specify all databases, registers, websites, organisations, reference lists and other sources searched or consulted to identify studies. Specify the date when each source was last searched or consulted.", "Taripaykunata tarinkapak maskashka tukuy willay tantanakuykunata, killkachikkunata, web pankakunata, tantanakuykunata, chimpapurashka listakunata, shuk pukyukunatapash willay. Sapan pukyuta tukuri kutin maskashka punchatapash willay."], ["Especifique, para cada desenlace, las medidas del efecto (por ejemplo, razón de riesgos, diferencia de medias) utilizadas en la síntesis o presentación de los resultados.", "Specify for each outcome the  apamuy» nishkapi «shuk ñankuna» maymanta shina yapay."], ["Si los estudios son heterogéneos, haz una síntesis narrativa con la guía **SWiM**: agrupa por temas o desenlaces, describe la dirección y la consistencia de los hallazgos y evita resumir estudio por estudio (ítems 13 y 20).", "If the studies are heterogeneous, carry out a narrative synthesis with the **SWiM** guideline: group by themes or outcomes, describe the direction and consistency of the findings and avoid summarising study by study (items 13 and 20).", "Taripaykuna mana kikin kakpika **SWiM** pushakwan willay tantachiyta ruray: yuyaykunapi, lluksishkakunapipash tantachiy, tarishkakuna maymanta rishkata, kikin kashkatapash willay, sapan sapan taripayta ama uchillayachiychu (13, 20 shuyukuna)."], ["Si no lo encuentras tras intentarlo (incluido escribir al autor), márcalo como «no recuperado».", "If you cannot find it after trying (including writing to the author), mark it as “not retrieved”.", "Maskashka washa mana tarishpaka (killkakman killkashpapash), «mana tarishka» shina rikuchiy."], ["Si tu tema tiene dos preguntas (por ejemplo, efectos y experiencias), crea dos proyectos: cada uno tendrá su propio protocolo, búsqueda y diagrama.", "If your topic has two questions (for example, effects and experiences), create two projects: each will have its own protocol, search and diagram.", "Kikinpak yuyay ishkay tapuykunata charikpika (shina, lluksishkakuna, kawsaykunapash), ishkay proyectokunata ruray: sapanka paypak protocolota, maskayta, shuyutapash charinka."], ["Sin clave, Semantic Scholar comparte un cupo de consultas entre todos sus usuarios y a menudo responde «Too Many Requests». Si pasa, espera 1 a 5 minutos y recarga la pestaña (F5), o usa OpenAlex, que cubre la misma literatura sin ese límite. Sin booleanos: busca por relevancia.", "Without a key, Semantic Scholar shares a query quota among all its users and often replies “Too Many Requests”. If that happens, wait 1 to 5 minutes and reload the tab (F5), or use OpenAlex, which covers the same literature without that limit. No Boolean operators: it searches by relevance.", "Llavi illak, Semantic Scholarka tukuy llamkachikkunapura shuk tapuy yupayta rakin, achka kutinpash «Too Many Requests» nishpa kutichin. Chashna kakpika 1 - 5 minutokunata shuyay, pankata kutin apamuy (F5), mana kashpaka OpenAlexta llamkachiy, chayka kikin killkakunata mana harkaywan charin. Booleano illak: ima kashkamanta maskan."], ["Sin desenlaces valorados.", "No outcomes rated.", "Mana chaninchishka lluksishkakuna."], ["Sin guardar: descarga un respaldo", "Not saved: download a backup", "Mana wakaychishka: wakaychikta uraykuchiy"], ["Sin registro", "Not registered", "Mana killkachishka"], ["Solo acceso abierto (OpenAlex)", "Open access only (OpenAlex)", "Paskashkalla (OpenAlex)"], ["Solo artículos (cuando la base lo permite)", "Articles only (when the database allows it)", "Killkakunalla (tantanakuy sakikpi)"], ["Sugerencia del tutor: Excluir", "Tutor's suggestion: Exclude", "Yachachikpak rikuchiy: Anchuchiy"], ["Sugerido", "Suggested", "Rikuchishka"], ["Sugerir criterios desde mi pregunta", "Suggest criteria from my question", "Ñuka tapuymanta kamachikkunata rikuchiy"], ["Sugerir sinónimos ES/EN/PT", "Suggest synonyms ES/EN/PT", "ES/EN/PT kikin shina shimikunata rikuchiy"], ["Suscripción", "Subscription", "Kullki churashka"], ["Suscripción institucional", "Institutional subscription", "Yachana wasipak kullki churashka"], ["Sustancial", "Substantial", "Sinchi"], ["Sí", "Yes", "Ari"], ["Sí/No", "Yes/No", "Ari/Mana"], ["Síntesis", "Synthesis", "Tantachiy"], ["Síntesis de evidencia cualitativa y de métodos mixtos.", "Synthesis of qualitative and mixed-methods evidence.", "Cualitativo, chakrushka ñankunapak rikuchikkunata tantachiy."], ["Síntesis de resultados", "Synthesis of results", "Lluksishkakunata tantachiy"], ["Síntesis y discusión", "Synthesis and discussion", "Tantachiy, rimanakuypash"], ["Síntesis y discusión →", "Synthesis and discussion →", "Tantachiy, rimanakuypash →"], ["Síntesis, certeza y discusión", "Synthesis, certainty and discussion", "Tantachiy, takyay, rimanakuypash"], ["TRABAJAR CON CLAUDE EN EXCEL", "WORKING WITH CLAUDE IN EXCEL", "CLAUDEWAN EXCELPI LLAMKAY"], ["Tabulación y presentación", "Tabulation and presentation", "Tablakunapi churay, rikuchiypash"], ["Tabulación y presentación (ítem 13c)", "Tabulation and presentation (item 13c)", "Tablakunapi churay, rikuchiypash (13c shuyu)"], ["También puedes usar los atajos de abajo.", "You can also use the shortcuts below.", "Uraypi tiyak utka llapinakunatapash llamkachiy ushanki."], ["Tema", "Theme", "Yuyay"], ["Tema y requisito", "Topic and requirement", "Yuyay, mañaypash"], ["Tema «Rendimiento académico»: 7 de 9 estudios reportan mejoras; los 2 restantes sin diferencias; certeza moderada por riesgo de sesgo en la asignación.", "Theme “Academic achievement”: 7 of 9 studies report improvements; the other 2 show no differences; moderate certainty due to risk of bias in allocation.", "«Yachaypi paktay» yuyay: 9 taripaykunamanta 7 allichiyta willan; puchuk 2 mana shuktayanchu; rakiypi sesgomanta chawpi takyay."], ["Temas o desenlaces", "Themes or outcomes", "Yuyaykuna, lluksishkakunapash"], ["Temática", "Thematic", "Yuyaykunamanta"], ["Texto completo", "Full text", "Tukuy killka"], ["Texto completo no disponible", "Full text not available", "Tukuy killka mana tiyanchu"], ["Texto completo →", "Full text →", "Tukuy killka →"], ["Texto del tema", "Theme text", "Yuyaypak killka"], ["Texto modelo", "Template text", "Rikuchik killka"], ["Texto modelo agregado en los campos vacíos. Adáptalo a tu revisión.", "Template text added to the empty fields. Adapt it to your review.", "Chushak kamakunapi rikuchik killka yapashka. Kikinpak rikuyman allichiy."], ["Texto seleccionado: cópialo con Ctrl+C.", "Text selected: copy it with Ctrl+C.", "Killka akllashka: Ctrl+Cwan kopiay."], ["Textos completos de acceso abierto", "Open-access full texts", "Paskashka tukuy killkakuna"], ["Tipo de publicación no elegible (editorial, reseña, opinión)", "Publication type not eligible (editorial, review, opinion)", "Lluksichiy imashina kay mana akllanachu (editorial, reseña, yuyay)"], ["Tipo de revisión", "Review type", "Rikuy imashina kay"], ["Tipo de síntesis", "Synthesis type", "Tantachiy imashina kay"], ["Todos", "All", "Tukuy"], ["Todos los elementos del marco están descritos", "All elements of the framework are described", "Marcopak tukuy shuyukuna willashka"], ["Total", "Total", "Tukuy"], ["Total reportado", "Total reported", "Tukuy willachishka"], ["Trabajar el cribado en Excel con Claude y un segundo revisor", "Working on screening in Excel with Claude and a second reviewer", "Claudewan, ishkay kati rikukwanpash Excelpi akllanata llamkay"], ["Transversal / encuesta", "Cross-sectional / survey", "Transversal / tapuykuna"], ["Tras duplicados", "After duplicates", "Iskaychishkakuna washa"], ["Tu avance", "Your progress", "Kikinpak ñawpakman purishka"], ["Tu proyecto se guarda solo", "Your project saves itself", "Kikinpak proyecto kikinllatak wakaychirin"], ["Tus proyectos se guardan en este navegador. Descarga respaldos con frecuencia.", "Your projects are saved in this browser. Download backups often.", "Kikinpak proyectokuna kay maskakpi wakaychirin. Achka kutin wakaychikkunata uraykuchiy."], ["Tus proyectos se guardan en tu cuenta y están disponibles en cualquier dispositivo.", "Your projects are saved to your account and available on any device.", "Kikinpak proyectokuna cuentapi wakaychirin, ima antawapipash tiyan."], ["Tutor", "Tutor", "Yachachik"], ["Tutor PRISMA", "PRISMA Tutor", "PRISMA yachachik"], ["TÍTULO", "TITLE", "SHUTI"], ["Términos (OR)", "Terms (OR)", "Shimikuna (OR)"], ["Título", "Title", "Shuti"], ["Título provisional", "Working title", "Kallari shuti"], ["Título y resumen", "Title and abstract", "Shuti, uchilla killkapash"], ["Título y resumen →", "Title and abstract →", "Shuti, uchilla killkapash →"], ["URL", "URL", "URL"], ["Un buen marco convierte tu tema en elementos buscables. Usa **PICO** si evalúas el efecto de un programa o política; **PICo** o **SPIDER** si quieres comprender experiencias; **PEO** para exposiciones; **PCC** para revisiones de alcance. Cada elemento debe ser observable: quiénes, qué, dónde y qué se mide (ítems 3 y 4). Siguiente paso: completa los campos en «Pregunta PICO» y revisa la autoevaluación.", "A good framework turns your topic into searchable elements. Use **PICO** if you evaluate the effect of a programme or policy; **PICo** or **SPIDER** if you want to understand experiences; **PEO** for exposures; **PCC** for scoping reviews. Each element must be observable: who, what, where and what is measured (items 3 and 4). Next step: complete the fields in “PICO question” and check the self-assessment.", "Alli marcoka kikinpak yuyayta maskana shuyukunaman tikran. Programapak, kamachikpak lluksishkata chaninchishpaka **PICO** llamkachiy; kawsaykunata hamutanata munashpaka **PICo**, **SPIDER**; ima tiyashkapak **PEO**; alcance rikuykunapak **PCC**. Sapan shuyu rikurik kana kan: pikuna, ima, maypi, ima tupushka (3, 4 shuyukuna). Kati niki: «PICO tapuy» nishkapi kamakunata huntachiy, kikin chaninchiytapash rikuy."], ["Un duplicado es el mismo registro encontrado en dos bases. La herramienta los detecta por DOI o por título y año. Revisa los dudosos en «Importar registros» y cambia su estado si no lo son. En el diagrama se reportan como «Registros eliminados antes del cribado».", "A duplicate is the same record found in two databases. The tool detects them by DOI or by title and year. Review doubtful ones in “Import records” and change their status if they are not duplicates. In the diagram they are reported as “Records removed before screening”.", "Iskaychishkaka ishkay tantanakuypi tarishka kikin killkami kan. Antawaka DOIwan, mana kashpaka shutiwan, watawanpash tarin. Iskay yuyaykunata «Killkakunata apamuy» nishkapi rikuy, mana iskaychishka kakpika imashina kayta shuktachiy. Shuyupika «Manara akllashpa anchuchishka killkakuna» shina willachin."], ["Un proyecto por pregunta", "One project per question", "Sapan tapuypak shuk proyecto"], ["Un solo término por concepto.", "A single term per concept.", "Sapan yuyaypak shuk shimilla."], ["Una lista por diseño: transversal, cualitativo, cuasiexperimental.", "One checklist per design: cross-sectional, qualitative, quasi-experimental.", "Sapan ruranapak shuk lista: transversal, cualitativo, cuasiexperimental."], ["Universidad · Programa · Curso", "University · Programme · Course", "Hatun yachana wasi · Programa · Yachay"], ["Usa comillas para frases exactas y * para truncar (docen* = docente, docentes, docencia).", "Use quotation marks for exact phrases and * for truncation (teach* = teacher, teachers, teaching).", "Kikin rimaykunapak « » churay, kuchunkapak * churay (yachach* = yachachik, yachachikkuna, yachachiy)."], ["Usa los atajos I (incluir), E (excluir), D (duda), flechas para moverte.", "Use the shortcuts I (include), E (exclude), D (unsure), and the arrows to move.", "Utka llapinakunata llamkachiy: I (yaykuchiy), E (anchuchiy), D (iskay yuyay), purinkapakka wachikunata."], ["Usa «Texto modelo» para obtener una redacción base a partir de tus decisiones y adáptala. Un método que no aplica también se declara.", "Use “Template text” to get a base wording from your decisions and adapt it. A method that does not apply is also declared.", "Kikinpak akllaykunamanta kallari killkata charinkapak «Rikuchik killka» nishkata llamkachiy, allichiypash. Mana kak ñantapash willana kan."], ["Usar AND dentro de un bloque de sinónimos.", "Using AND within a block of synonyms.", "Kikin shina shimikunapak tanta ukupi AND llamkachiy."], ["Usar PICO para una pregunta cualitativa.", "Using PICO for a qualitative question.", "Cualitativo tapuypak PICO llamkachiy."], ["Usar esta redacción", "Use this wording", "Kay rimayta llamkachiy"], ["Uso intensivo de redes sociales", "Heavy use of social media", "Achka redes sociales llamkachiy"], ["Vacío si es un estudio nuevo", "Empty if it is a new study", "Mushuk taripay kakpika chushak"], ["Valora la certeza por desenlace (GRADE o GRADE-CERQual para evidencia cualitativa).", "Rate certainty by outcome (GRADE, or GRADE-CERQual for qualitative evidence).", "Sapan lluksishkapak takyayta chaninchiy (GRADE, cualitativo rikuchikkunapak GRADE-CERQual)."], ["Valoración global", "Overall rating", "Tukuy chaninchiy"], ["Valorar la calidad con una puntuación total sin explicar los criterios.", "Scoring quality with a total score without explaining the criteria.", "Kamachikkunata mana willashpa tukuy yupaywan allikayta chaninchiy."], ["Vea la lista de verificación para resúmenes estructurados de la declaración PRISMA 2020 (tabla 2).", "See the PRISMA 2020 for Abstracts checklist (table 2).", "PRISMA 2020 uchilla killkakunapak rikuna killkata rikuy (2 tabla)."], ["Ver motivos abajo", "See reasons below", "Uraypi kamachikkunata rikuy"], ["Ver todos mis proyectos", "See all my projects", "Tukuy ñuka proyectokunata rikuy"], ["Verificar que el informe cumple los 27 ítems de PRISMA 2020 e indicar dónde se reporta cada uno.", "Check that the report meets the 27 PRISMA 2020 items and indicate where each one is reported.", "Willachik PRISMA 2020pak 27 shuyukunata paktachishkata rikuy, sapan maypi willachishkatapash killkay."], ["Verificar que el informe cumple los 27 ítems de PRISMA 2020 e indicar dónde se reporta ca…", "Check that the report meets the 27 PRISMA 2020 items and indicate where each one is reported.", "Willachik PRISMA 2020pak 27 shuyukunata paktachishkata rikuy, sapan maypi willachishkatapash killkay."], ["Volver a detectar duplicados", "Detect duplicates again", "Iskaychishkakunata kutin maskay"], ["Web", "Web", "Web"], ["Web abierta", "Open web", "Paskashka web"], ["Web of Science", "Web of Science", "Web of Science"], ["[Pendiente]", "[Pending]", "[Shuyakun]"], ["al tutor", "the tutor", "yachachi How do I choose the exclusion reason?", "¿Anchuchina kamachikta imashina akllani?"], ["¿Cómo manejo los duplicados?", "How do I handle duplicates?", "¿Iskaychishkakunata imashina allichini?"], ["¿Cómo organizo la síntesis por temas?", "How do I organise the synthesis by themes?", "¿Tantachiyta yuyaykunapi imashina allichini?"], ["¿Cómo organizo mis proyectos?", "How do I organise my projects?", "¿Ñuka proyectokunata imashina allichini?"], ["¿Cómo valoro la certeza con CERQual?", "How do I rate certainty with CERQual?", "¿CERQualwan takyayta imashina chaninchini?"], ["¿El análisis es adecuado y está bien descrito?", "Is the analysis appropriate and well described?", "¿Rikuyka alli, alli willashkachu?"], ["¿El diseño o método es apropiado para la pregunta?", "Is the design or method appropriate for the question?", "¿Rurana, ñanpash tapuypak allichu?"], ["¿Hay preguntas de investigación claras?", "Are there clear research questions?", "¿Sut'i taripay tapuykuna tiyanchu?"], ["¿Incluido?", "Included?", "¿Yaykuchishkachu?"], ["¿Las interpretaciones están suficientemente sustentadas por los datos?", "Are the interpretations sufficiently supported by the data?", "¿Yuyaychiykunaka willaykunawan alli takyachishkachu?"], ["¿Los datos recogidos permiten abordar las preguntas?", "Do the collected data allow the questions to be addressed?", "¿Tantachishka willaykunawan tapuykunata kutichiy ushanchu?"], ["¿Mis criterios son suficientes?", "Are my criteria sufficient?", "¿Ñuka kamachikkuna paktanchu?"], ["¿PICO o SPIDER para mi tema?", "PICO or SPIDER for my topic?", "¿Ñuka yuyaypak PICO, SPIDERchu?"], ["¿Por dónde empiezo?", "Where do I start?", "¿Maymanta kallarini?"], ["¿Por qué no cuadran las cifras?", "Why don't the numbers add up?", "¿Imamanta yupaykuna mana paktanchu?"], ["¿Por qué?", "Why?", "¿Imamanta?"], ["¿Quiénes? Nivel, edad, contexto, país.", "Who? Level, age, context, country.", "¿Pikuna? Pata, wata, kawsay, mama llakta."], ["¿Qué bases me convienen?", "Which databases suit me?", "¿Maykan willay tantanakuykuna ñukapak alli?"], ["¿Qué datos debo extraer?", "What data should I extract?", "¿Ima willaykunata hurkuna kani?"], ["¿Qué es PRISMA 2020?", "What is PRISMA 2020?", "¿Ima shinatak PRISMA 2020?"], ["¿Qué es el coeficiente kappa?", "What is the kappa coefficient?", "¿Ima shinatak kappa yupay?"], ["¿Qué hago si no encuentro el texto?", "What do I do if I cannot find the text?", "¿Killkata mana tarishpaka imata rurani?"], ["¿Qué herramienta de calidad uso?", "Which quality tool should I use?", "¿Maykan allikay antawata llamkachini?"], ["¿Qué reviso antes de entregar?", "What should I check before submitting?", "¿Manara kachashpa imata rikuna kani?"], ["¿Qué significa «No aplica»?", "What does “Not applicable” mean?", "¿«Mana kanchu» ima nintak?"], ["¿Qué tipo de revisión me conviene?", "Which type of review suits me?", "¿Maykan rikuy ñukapak alli?"], ["¿Qué ítems me faltan?", "Which items am I missing?", "¿Maykan shuyukuna illan?"], ["¿Texto recuperado?", "Text retrieved?", "¿Killka tarishkachu?"], ["¿Trabajan de forma independiente?", "Do they work independently?", "¿Sapalla llamkankunachu?"], ["Ábrelo en Excel con el complemento Claude en Excel y pídele, por ejemplo: «Resume los motivos de exclusión de la columna K» o «Señala filas con Decisión R1 = Duda y explica qué criterio está en juego». Las decisiones las tomas tú.", "Open it in Excel with the Claude in Excel add-in and ask, for example: “Summarise the exclusion reasons in column K” or “Flag rows with Decision R1 = Unsure and explain which criterion is at stake”. You make the decisions.", "Excelpi Claude in Excel yapaywan paskay, kashna mañay: «K columnapi anchuchina kamachikkunata uchillayachiy», mana kashpaka «Decisión R1 = Iskay yuyay wachukunata rikuchiy, maykan kamachik tiyashkatapash willay». Akllaykunaka kikinpakmi."], ["Ámbito geográfico, cultural o sectorial.", "Geographic, cultural or sectoral scope.", "Kiti, kawsay, llamkay kuchupash."], ["Ítem", "Item", "Shuy /* Traducción del DOM: el código genera español y aquí se presenta en el idioma elegido */
const ORIG=new WeakMap();const ATTRS=["placeholder","aria-label","title"];
function tnodo(t){const v=t.nodeValue;if(!v||!/[A-Za-zÁÉÍÓÚáéíóúñÑ¿]/.test(v))return;const r=tr(v);if(r!==v){t.nodeValue=r;ORIG.set(t,[v,r])}}
function telem(el){
  if(el.tagName==="OPTION"&&!el.hasAttribute("value"))el.setAttribute("value",el.textContent);
  ATTRS.forEach(a=>{const v=el.getAttribute(a);if(!v)return;const r=tr(v);if(r!==v){el.setAttribute(a,r);el.setAttribute("data-i18n-"+a,v)}});
}
const NOI18N=n=>n.nodeType===1&&(n.hasAttribute("data-noi18n")||/^(SCRIPT|STYLE|TEXTAREA|PRE)$/.test(n.tagName));
function traducirArbol(root){
  if(LANG==="es"||!root)return;
  if(root.nodeType===3){if(!root.parentElement?.closest("[data-noi18n],textarea,pre"))tnodo(root);return}
  if(root.nodeType!==1||root.closest("[data-noi18n]")||NOI18N(root))return;
  telem(root);
  root.querySelectorAll("textarea[placeholder],pre[title]").forEach(telem);
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT|NodeFilter.SHOW_ELEMENT,{acceptNode:n=>NOI18N(n)?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});
  let n;while((n=w.nextNode())){n.nodeType===3?tnodo(n):telem(n)}
}
function restaurarArbol(root){
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT|NodeFilter.SHOW_ELEMENT);let n;
  while((n=w.nextNode())){if(n.nodeType===3){const o=ORIG.get(n);if(o&&n.nodeValue===o[1])n.nodeValue=o[0];ORIG.delete(n)}
    else ATTRS.forEach(a=>{const o=n.getAttribute("data-i18n-"+a);if(o!=null){n.setAttribute(a,o);n.removeAttribute("data-i18n-"+a)}})}
}

  obsI18n.observe(document.body,{childList:true,subtree:true,characterData:true});

}

      if(old.exists){const p=old.data();const n=p.nChunks||0;let regs=[];for(let i=0;i<n;i++){const s=await db.doc(`${base}reg${i}`).get();if(s.exists)regs=regs.concat(s.data().items||[])}

}

function decTA(r){return r.ta?.cons||r.ta?.d||""}
function cuentas(){
  const R=S.registros, db=R.filter(r=>r.origen!=="otros"), ot=R.filter(r=>r.origen==="otros");
  const porBase={};db.forEach(r=>{porBase[r.fuente]=(porBase[r.fuente]||0)+1});
  const dup=db.filter(r=>r.rm==="dup").length, auto=db.filter(r=>r.rm==="auto").length, otra=db.filter(r=>r.rm==="otra").length;
  const cribables=db.filter(r=>!r.rm);
  const excTA=cribables.filter(r=>decTA(r)==="Excluir").length;
  const incTA=cribables.filter(r=>decTA(r)==="Incluir");
  const pendTA=cribables.filter(r=>!decTA(r)||decTA(r)==="Duda").length;
  const ftPool=(arr)=>{const noRec=arr.filter(r=>r.ft?.rec==="No").length;const ev=arr.filter(r=>r.ft?.rec==="Sí");
    const exc=ev.filter(r=>r.ft?.d==="Excluir");const inc=ev.filter(r=>r.ft?.d==="Incluir");

function kappa(){

function fmtTerm(t,st){
  let core=t.trim().replace(/^"+|"+$/g,"");if(!core)return "";
  if(st.noTrunc||st.plano) core=core.replace(/\*/g,"");
  else if(st.trunc) core=core.replace(/\*/g,st.trunc);
  return /\s/.test(core)?`"${core}"`:core;
}
function cadena(st={}){
  const bl=S.bloques.filter(b=>b.terminos.length);
  if(st.plano) return bl.map(b=>{const sinT=b.terminos.filter(t=>!t.includes("*"));return (sinT.length?sinT:b.terminos)}).map(ts=>ts.slice(0,2).map(t=>fmtTerm(t,st).replace(/"/g,"")).join(" ")).join(" ");
  const core=bl.map(b=>"("+b.terminos.map(t=>fmtTerm(t,st)).filter(Boolean).join(" OR ")+")").join(" AND ");
  if(!core) return "";
  const P=S.protocolo;
  if(st.scopus) return `TITLE-ABS-KEY(${core})`+(P.desde?` AND PUBYEAR > ${P.desde-1}`:"")+(P.hasta?` AND PUBYEAR < ${+P.hasta+1}`:"");
  if(st.wos) return `TS=(${core})`+(P.desde?` AND PY=(${P.desde}-${P.hasta||new Date().getFullYear()})`:"");
  return core;
}
